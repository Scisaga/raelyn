          <!-- 从全部资料加入当前观测域 -->
          <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 p-4" x-show="domainSourcePickerOpen" x-transition.opacity x-cloak @keydown.escape.window="domainSourcePickerOpen=false">
            <div class="flex max-h-[80vh] w-full max-w-2xl flex-col overflow-hidden rounded-xl border border-slate-700 bg-slate-950 shadow-2xl">
              <div class="flex shrink-0 items-center justify-between border-b border-slate-800 px-5 py-4"><div><div class="text-sm font-semibold text-slate-100">从全部资料加入信源</div><div class="mt-1 text-xs text-slate-500" x-text="`加入 ${currentDomainLabel()}；不会复制信源或历史记录。`"></div></div><button type="button" class="rounded p-2 text-slate-500 hover:bg-slate-800 hover:text-slate-100" @click="domainSourcePickerOpen=false" aria-label="关闭">✕</button></div>
              <div class="shrink-0 border-b border-slate-800 p-4"><input class="w-full rounded-md border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-slate-100 outline-none focus:border-cyan-500/50" placeholder="搜索名称、描述或 URL" x-model="domainSourceQuery" @input.debounce.300ms="loadDomainSourceCandidates()" /></div>
              <div class="min-h-0 flex-1 divide-y divide-slate-800 overflow-auto raelyn-scrollbar">
                <template x-for="source in domainSourceCandidates" :key="source.id"><div class="flex items-center gap-3 px-4 py-3"><div class="min-w-0 flex-1"><div class="truncate text-sm text-slate-200" x-text="source.name || source.url"></div><div class="mt-1 truncate text-xs text-slate-600" x-text="source.url"></div></div><span class="rounded-full border border-slate-800 px-2 py-1 text-[10px] text-slate-500" x-text="`${source.record_count || 0} 条`"></span><button type="button" class="rounded-md border px-3 py-1.5 text-xs disabled:cursor-not-allowed disabled:opacity-50" :class="source.in_current_domain ? 'border-emerald-500/25 bg-emerald-500/10 text-emerald-200' : 'border-cyan-500/30 bg-cyan-500/10 text-cyan-100 hover:bg-cyan-500/20'" :disabled="source.in_current_domain || domainSourceAttachSubmittingId===source.id" @click="attachExistingSourceToDomain(source)" x-text="source.in_current_domain ? '已在当前域' : domainSourceAttachSubmittingId===source.id ? '加入中…' : '加入'"></button></div></template>
                <div class="p-8 text-center text-xs text-slate-600" x-show="domainSourceCandidatesLoading">正在搜索全部资料…</div><div class="p-8 text-center text-xs text-slate-600" x-show="!domainSourceCandidatesLoading && !domainSourceCandidates.length">没有匹配的全局信源；可关闭此窗口后通过 URL 新建并加入。</div>
              </div>
            </div>
          </div>

          <!-- 当前观测域设置 -->
          <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 p-4" x-show="domainSettingsOpen" x-transition.opacity x-cloak @keydown.escape.window="domainSettingsOpen=false">
            <div class="max-h-[88vh] w-full max-w-3xl overflow-auto rounded-xl border border-slate-700 bg-slate-950 shadow-2xl raelyn-scrollbar">
              <div class="sticky top-0 z-10 flex items-center justify-between border-b border-slate-800 bg-slate-950/95 px-5 py-4"><div><div class="text-sm font-semibold text-slate-100">当前观测域设置</div><div class="mt-1 text-xs text-slate-500" x-text="currentDomainLabel()"></div></div><button type="button" class="rounded p-2 text-slate-500 hover:bg-slate-800 hover:text-slate-100" @click="domainSettingsOpen=false" aria-label="关闭">✕</button></div>
              <div class="space-y-5 p-5" x-show="!domainSettingsLoading">
                <section class="rounded-lg border border-slate-800 bg-slate-900/35 p-4"><div class="text-xs font-semibold text-slate-200">名称与说明</div><div class="mt-3 grid gap-3"><input class="rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100" x-model="domainSettingsNameDraft" placeholder="完整观测域名称" /><textarea class="min-h-20 rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100" x-model="domainSettingsDescriptionDraft" placeholder="观测目标与范围"></textarea><button type="button" class="justify-self-end rounded-md bg-emerald-500 px-3 py-2 text-xs font-semibold text-slate-950 disabled:opacity-50" :disabled="!domainSettingsNameDraft.trim() || domainSettingsSaving" @click="saveDomainSettingsIdentity()" x-text="domainSettingsSaving ? '保存中…' : '保存基础信息'"></button></div></section>
                <section class="rounded-lg border border-slate-800 bg-slate-900/35 p-4"><div class="text-xs font-semibold text-slate-200">头像与背景图</div><div class="mt-3 flex flex-wrap items-center gap-3"><button type="button" class="rounded-md border border-slate-700 px-3 py-2 text-xs text-slate-300 hover:bg-slate-800" @click="$refs.domainAvatarInput.click()">更换头像</button><input x-ref="domainAvatarInput" type="file" class="hidden" accept="image/png,image/jpeg,image/webp" @change="playlistUploadAvatar($event)" /><button type="button" class="rounded-md border border-slate-700 px-3 py-2 text-xs text-slate-300 hover:bg-slate-800" @click="$refs.domainBackgroundInput.click()">更换背景</button><input x-ref="domainBackgroundInput" type="file" class="hidden" accept="image/png,image/jpeg,image/webp" @change="playlistUploadBackground($event)" /><button type="button" class="rounded-md px-3 py-2 text-xs text-slate-500 hover:bg-slate-800" x-show="playlistDetail?.background_asset" @click="playlistClearBackground()">清除背景</button></div></section>
                <section class="rounded-lg border border-slate-800 bg-slate-900/35 p-4"><div class="text-xs font-semibold text-slate-200">职责摘要</div><div class="mt-3 grid grid-cols-2 gap-2 sm:grid-cols-4"><div class="rounded bg-slate-950/60 p-3"><div class="text-[10px] text-slate-600">信源</div><div class="mt-1 font-mono text-sm text-slate-200" x-text="domainDeletionImpact?.counts?.source_links ?? '—'"></div></div><div class="rounded bg-slate-950/60 p-3"><div class="text-[10px] text-slate-600">简报策略</div><div class="mt-1 text-xs text-cyan-200" x-text="playlistDetail?.brief_granularity || 'day'"></div></div><div class="rounded bg-slate-950/60 p-3"><div class="text-[10px] text-slate-600">星域快照</div><div class="mt-1 font-mono text-sm text-violet-200" x-text="domainDeletionImpact?.counts?.snapshots ?? '—'"></div></div><div class="rounded bg-slate-950/60 p-3"><div class="text-[10px] text-slate-600">活跃任务</div><div class="mt-1 font-mono text-sm" :class="domainDeletionImpact?.counts?.active_jobs ? 'text-amber-300' : 'text-emerald-300'" x-text="domainDeletionImpact?.counts?.active_jobs ?? '—'"></div></div></div><div class="mt-3 flex flex-wrap gap-2"><button type="button" class="rounded border border-slate-700 px-2.5 py-1.5 text-[10px] text-slate-300" @click="domainSettingsOpen=false; switchView('library')">管理信源范围</button><button type="button" class="rounded border border-slate-700 px-2.5 py-1.5 text-[10px] text-slate-300" @click="domainSettingsOpen=false; switchView('briefs')">简报生成设置</button><button type="button" class="rounded border border-slate-700 px-2.5 py-1.5 text-[10px] text-slate-300" @click="domainSettingsOpen=false; switchView('field')">查看星域</button><button type="button" class="rounded border border-slate-700 px-2.5 py-1.5 text-[10px] text-slate-300" @click="domainSettingsOpen=false; openOperations({type:'field', domain_name: currentDomainLabel()})">运行中心</button></div></section>
                <section class="rounded-lg border border-rose-900/60 bg-rose-950/15 p-4">
                  <div class="text-xs font-semibold text-rose-200">危险操作：删除观测域</div>
                  <div class="mt-3 grid grid-cols-2 gap-2 text-[10px] sm:grid-cols-4">
                    <div class="rounded border border-rose-900/35 bg-slate-950/55 p-2"><span class="text-slate-600">信源关联</span><strong class="ml-1 font-mono text-rose-100" x-text="domainDeletionImpact?.counts?.source_links ?? '—'"></strong></div>
                    <div class="rounded border border-rose-900/35 bg-slate-950/55 p-2"><span class="text-slate-600">简报</span><strong class="ml-1 font-mono text-rose-100" x-text="(domainDeletionImpact?.counts?.briefs || 0) + (domainDeletionImpact?.counts?.legacy_daily_briefs || 0)"></strong></div>
                    <div class="rounded border border-rose-900/35 bg-slate-950/55 p-2"><span class="text-slate-600">星域快照</span><strong class="ml-1 font-mono text-rose-100" x-text="domainDeletionImpact?.counts?.snapshots ?? '—'"></strong></div>
                    <div class="rounded border border-rose-900/35 bg-slate-950/55 p-2"><span class="text-slate-600">变化</span><strong class="ml-1 font-mono text-rose-100" x-text="domainDeletionImpact?.counts?.changes ?? '—'"></strong></div>
                    <div class="rounded border border-rose-900/35 bg-slate-950/55 p-2"><span class="text-slate-600">故事</span><strong class="ml-1 font-mono text-rose-100" x-text="domainDeletionImpact?.counts?.story_identities ?? '—'"></strong></div>
                    <div class="rounded border border-rose-900/35 bg-slate-950/55 p-2"><span class="text-slate-600">观察状态</span><strong class="ml-1 font-mono text-rose-100" x-text="domainDeletionImpact?.counts?.observation_cursor ?? '—'"></strong></div>
                    <div class="rounded border border-rose-900/35 bg-slate-950/55 p-2"><span class="text-slate-600">活跃任务</span><strong class="ml-1 font-mono text-amber-200" x-text="domainDeletionImpact?.counts?.active_jobs ?? '—'"></strong></div>
                  </div>
                  <p class="mt-3 text-xs leading-5 text-rose-200/70" x-text="domainDeletionImpact?.retained_shared_data?.message || '共享信源、来源记录和播放资产不会删除。'"></p>
                  <p class="mt-1 text-[10px] text-slate-600">不会自动取消活跃任务；存在活跃域任务时删除会被阻断。</p>
                  <div class="mt-3 flex flex-col gap-2 sm:flex-row"><input class="min-w-0 flex-1 rounded-md border border-rose-900/60 bg-slate-950 px-3 py-2 text-sm text-rose-100" x-model="domainDeleteConfirmDraft" :placeholder="`输入完整名称：${playlistDetail?.name || ''}`" /><button type="button" class="rounded-md border border-rose-700 bg-rose-900/30 px-3 py-2 text-xs text-rose-100 disabled:cursor-not-allowed disabled:opacity-40" :disabled="domainDeleteConfirmDraft !== String(playlistDetail?.name || '') || domainDeleteSubmitting || (domainDeletionImpact?.counts?.active_jobs || 0)>0" @click="deleteCurrentDomainSafely()" x-text="domainDeleteSubmitting ? '删除中…' : '永久删除观测域'"></button></div>
                </section>
              </div>
              <div class="p-8 text-center text-xs text-slate-500" x-show="domainSettingsLoading">正在核对观测域与删除影响…</div>
            </div>
          </div>

          <!-- 简报生成设置 -->
          <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 p-4" x-show="briefGenerationSettingsOpen" x-transition.opacity x-cloak @keydown.escape.window="briefGenerationSettingsOpen=false"><div class="w-full max-w-lg rounded-xl border border-slate-700 bg-slate-950 p-5 shadow-2xl"><div class="flex items-center justify-between"><div class="text-sm font-semibold text-slate-100">简报生成设置</div><button type="button" class="text-slate-500" @click="briefGenerationSettingsOpen=false">✕</button></div><label class="mt-5 block text-xs text-slate-500">自动简报周期<select class="mt-2 w-full rounded-md border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-slate-100" x-model="briefGenerationGranularityDraft"><option value="day">每日</option><option value="week">每周</option><option value="month">每月</option></select></label><label class="mt-4 block text-xs text-slate-500">观测域提示词<textarea class="mt-2 min-h-36 w-full rounded-md border border-slate-700 bg-slate-900 px-3 py-2 text-sm leading-6 text-slate-100" x-model="briefGenerationPromptDraft" placeholder="留空使用系统默认提示词"></textarea></label><div class="mt-5 flex justify-end gap-2"><button type="button" class="rounded-md border border-slate-700 px-3 py-2 text-xs text-slate-300" @click="briefGenerationSettingsOpen=false">取消</button><button type="button" class="rounded-md bg-emerald-500 px-3 py-2 text-xs font-semibold text-slate-950 disabled:opacity-50" :disabled="briefGenerationSaving" @click="saveBriefGenerationSettings()" x-text="briefGenerationSaving ? '保存中…' : '保存'"></button></div></div></div>

          <!-- 批量生成简报 -->
          <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 p-4" x-show="briefBatchOpen" x-transition.opacity x-cloak @keydown.escape.window="briefBatchOpen=false"><div class="w-full max-w-lg rounded-xl border border-slate-700 bg-slate-950 p-5 shadow-2xl"><div class="flex items-center justify-between"><div class="text-sm font-semibold text-slate-100">批量生成简报</div><button type="button" class="text-slate-500" @click="briefBatchOpen=false">✕</button></div><div class="mt-5 grid gap-4 sm:grid-cols-3"><label class="text-xs text-slate-500">粒度<select class="mt-2 w-full rounded-md border border-slate-700 bg-slate-900 px-2 py-2 text-sm text-slate-100" x-model="briefBatchGranularity"><option value="day">日</option><option value="week">周</option><option value="month">月</option></select></label><label class="text-xs text-slate-500">开始日期<input type="date" class="mt-2 w-full rounded-md border border-slate-700 bg-slate-900 px-2 py-2 text-sm text-slate-100" x-model="briefBatchFrom" /></label><label class="text-xs text-slate-500">结束日期<input type="date" class="mt-2 w-full rounded-md border border-slate-700 bg-slate-900 px-2 py-2 text-sm text-slate-100" x-model="briefBatchTo" /></label></div><div class="mt-4 rounded-lg border border-cyan-500/20 bg-cyan-500/5 p-3 text-xs text-cyan-100">预计生成 <span class="font-mono font-semibold" x-text="briefBatchEstimatedPeriods()"></span> 个周期；任务将进入运行中心。</div><div class="mt-5 flex justify-end gap-2"><button type="button" class="rounded-md border border-slate-700 px-3 py-2 text-xs text-slate-300" @click="briefBatchOpen=false">取消</button><button type="button" class="rounded-md bg-cyan-400 px-3 py-2 text-xs font-semibold text-slate-950 disabled:opacity-50" :disabled="!briefBatchEstimatedPeriods() || briefBatchSubmitting" @click="submitBriefBatchGeneration()" x-text="briefBatchSubmitting ? '提交中…' : '提交批量任务'"></button></div></div></div>
