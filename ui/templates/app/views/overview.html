                              <div class="text-xs text-slate-400" x-show="!p || !Array.isArray(p.latest_period_videos) || p.latest_period_videos.length===0">-</div>
                            </div>

                            <div class="mt-2 text-[11px] text-slate-300/90 truncate hidden sm:block" x-show="p && p.latest_brief_snippet" x-text="p.latest_brief_snippet || ''"></div>

                        </div>
                      </button>

                    <div class="text-xs text-slate-500" x-show="!Array.isArray(stats.recentPlaylists) || stats.recentPlaylists.length===0">-</div>
