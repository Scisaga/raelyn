          <!-- Playlists -->
          <div x-show="activeView==='playlists'" x-transition.opacity class="raelyn-view raelyn-view--playlists h-full">
            <div class="raelyn-surface-base rounded-none overflow-hidden h-full flex flex-col min-h-0 divide-y divide-slate-800">
              <div class="raelyn-toolbar-band px-4 py-3 flex items-center gap-3">
                <div class="flex-1 min-w-0">
                  <input
                    class="w-full rounded-md border border-slate-700 bg-slate-950/30 px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500/30"
                    placeholder="搜索播放列表（名称/描述/ID）"
                    x-model="playlistListQuery"
                  />
                </div>
                <button
                  type="button"
                  class="inline-flex items-center justify-center gap-2 rounded-md bg-emerald-500 px-2.5 sm:px-3 py-2 text-sm font-medium text-slate-950 hover:bg-emerald-400 shrink-0"
                  @click="openCreatePlaylist()"
                  title="新建播放列表"
                  aria-label="新建播放列表"
                >
                  <svg
                    viewBox="0 0 24 24"
                    width="18"
                    height="18"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M12 5v14" />
                    <path d="M5 12h14" />
                  </svg>
                  <span>新建</span>
                </button>
              </div>
              <div class="flex-1 min-h-0 overflow-auto raelyn-scrollbar divide-y divide-slate-800">
                <template x-for="p in playlistListFiltered()" :key="p.id">
                  <button
                    type="button"
                    class="w-full p-4 flex items-center justify-between gap-4 text-left hover:bg-slate-900/50"
                    @click="openPlaylistPage(p.id)"
                  >
                    <div class="min-w-0 flex items-stretch gap-4">
                      <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-xl ring-1 ring-inset shrink-0 overflow-hidden" :class="p.avatar_asset ? 'ring-slate-800/70 bg-slate-800/30' : 'ring-slate-700/60 bg-slate-800 text-slate-200'">
                        <template x-if="p.avatar_asset">
                          <img class="w-full h-full rounded-xl object-cover" :src="assetContentUrl(p.avatar_asset)" alt="" loading="lazy" @error="clearAssetRef(p, 'avatar_asset')" />
                        </template>
                        <template x-if="!p.avatar_asset">
                          <div class="w-full h-full flex items-center justify-center">
                            <span class="text-sm font-semibold" x-text="(String(p.name||'?').trim().slice(0,2) || '?')"></span>
                          </div>
                        </template>
                      </div>
                      <div class="min-w-0 min-h-14 sm:min-h-16 flex flex-col justify-center">
                        <div class="font-medium truncate flex items-center gap-2">
                          <span x-text="p.name"></span>
                        </div>
                        <div class="text-xs text-slate-400 truncate" x-text="p.description || ''"></div>
                        <div class="mt-1 flex items-center gap-2 text-[11px] text-slate-500">
                          <div class="flex items-center -space-x-2 pr-1">
                            <template x-for="m in (p.media_preview || []).slice(0,5)" :key="m.id">
                              <div class="w-6 h-6 rounded-full ring-2 ring-slate-900/80 bg-slate-800 overflow-hidden">
                                <template x-if="m.avatar_asset">
                                  <img class="w-6 h-6 object-cover" :src="assetContentUrl(m.avatar_asset)" alt="" loading="lazy" @error="clearAssetRef(m, 'avatar_asset')" />
                                </template>
                                <template x-if="!m.avatar_asset">
                                  <div class="w-6 h-6 flex items-center justify-center text-[10px] font-semibold text-slate-200">
                                    <span x-text="mediaAvatarLabel(m)"></span>
                                  </div>
                                </template>
                              </div>
                            </template>
                            <template x-if="(p.media_count||0) > ((p.media_preview||[]).length || 0)">
                              <div class="w-6 h-6 rounded-full ring-2 ring-slate-900/80 bg-slate-950/40 border border-slate-700 flex items-center justify-center text-[10px] font-semibold text-slate-200">
                                <span x-text="`+${(p.media_count||0)-((p.media_preview||[]).length||0)}`"></span>
                              </div>
                            </template>
                          </div>
                          <span class="inline-flex items-center gap-1 rounded-full border border-slate-800 bg-slate-950/30 px-2 py-0.5 text-slate-300 whitespace-nowrap">
                            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                              <polygon points="23 7 16 12 23 17 23 7"></polygon>
                              <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                            </svg>
                            <span x-text="p.video_count||0"></span>
                          </span>
                        </div>
                      </div>
                    </div>
                    <div class="shrink-0 flex items-center gap-3 text-slate-400">
                      <div class="text-[11px] text-slate-500 text-right">
                        <div class="text-slate-400">更新</div>
                        <div class="text-slate-200" x-text="formatDateTimeShort(p.latest_video_at) || '-'"></div>
                      </div>
                      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M9 18l6-6-6-6"/>
                      </svg>
                    </div>
                  </button>
                </template>
                <div class="p-4 text-sm text-slate-400" x-show="(playlistList||[]).length>0 && playlistListFiltered().length===0">
                  无匹配播放列表
                </div>
              </div>
            </div>
          </div>
