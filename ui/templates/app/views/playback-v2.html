          <!-- V2 来源复盘工作台：只加载按日记录、播放资产和转写。 -->
          <div x-show="activeView==='playlist'" x-transition.opacity class="relative h-full bg-[#02050c] text-slate-200">
            <div class="flex h-full min-h-0 flex-col">
              <header class="flex h-14 shrink-0 items-center justify-between gap-3 border-b border-slate-800 bg-slate-950/90 px-3 sm:px-4">
                <div class="min-w-0">
                  <div class="truncate text-sm font-semibold text-slate-100" x-text="playlistDetail?.name || '播放列表'"></div>
                  <div class="mt-0.5 flex items-center gap-2 text-[10px] text-slate-500">
                    <span x-text="playlistSelectedDate || '选择日期'"></span>
                    <span>·</span>
                    <span x-text="`${playlistDayVideos.length} 条可播放记录`"></span>
                    <span class="text-amber-300" x-show="playbackDayTruncated">已达到 500 条上限，当前列表已截断</span>
                  </div>
                </div>
                <div class="flex shrink-0 items-center gap-2">
                  <div class="hidden items-center gap-1 rounded-md border border-slate-800 bg-slate-950/50 p-0.5 sm:flex" role="group" aria-label="媒体模式">
                    <button type="button" class="rounded px-2 py-1 text-[11px]" :class="!playlistAudioOnly ? 'bg-cyan-500/15 text-cyan-100' : 'text-slate-500'" @click="playlistAudioOnly && playlistToggleAudioOnly()">视频</button>
                    <button type="button" class="rounded px-2 py-1 text-[11px]" :class="playlistAudioOnly ? 'bg-cyan-500/15 text-cyan-100' : 'text-slate-500'" @click="!playlistAudioOnly && playlistToggleAudioOnly()">音频</button>
                  </div>
                  <a class="inline-flex h-8 items-center rounded-md border border-slate-800 px-2.5 text-[11px] text-slate-400 hover:text-slate-100" :href="playlistCurrentVideo?.url || '#'" target="_blank" rel="noreferrer" :class="playlistCurrentVideo ? '' : 'pointer-events-none opacity-40'">原始链接</a>
                </div>
              </header>

              <div class="min-h-0 flex-1 pb-[6.5rem] md:flex md:flex-col md:pb-16 lg:grid lg:grid-cols-[38%_62%] lg:pb-16">
                <!-- 记录列表：桌面独立滚动；手机通过标签切换。 -->
                <section class="h-full min-h-0 flex-col border-r border-slate-800 bg-slate-950/35 md:order-2 md:h-[38%] lg:order-none lg:h-full" :class="playbackMobileTab==='records' ? 'flex' : 'hidden md:flex'" aria-label="当日来源记录">
                  <div class="flex h-10 shrink-0 items-center justify-between border-b border-slate-800 px-3">
                    <span class="text-xs font-semibold text-slate-300">当日记录</span>
                    <span class="font-mono text-[10px] text-slate-600" x-text="playlistDayVideosLoading ? '加载中…' : `${playlistDayVideos.length}/500`"></span>
                  </div>
                  <div x-ref="playlistDayListScroller" class="min-h-0 flex-1 divide-y divide-slate-800 overflow-auto raelyn-scrollbar">
                    <template x-for="v in playlistDayVideos" :key="v.id">
                      <button type="button" class="block w-full px-3 py-3 text-left transition hover:bg-slate-900/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-cyan-400/50" :class="playlistCurrentVideo && String(playlistCurrentVideo.id)===String(v.id) ? 'bg-cyan-500/10' : ''" @click="playbackSelectVideo(v)">
                        <div class="flex items-start gap-3">
                          <div class="mt-0.5 h-9 w-9 shrink-0 overflow-hidden rounded-md border border-slate-800 bg-slate-900">
                            <img x-show="v.media_avatar_asset" class="h-full w-full object-cover" :src="v.media_avatar_asset ? assetContentUrl(v.media_avatar_asset) : ''" alt="" loading="lazy" />
                            <div x-show="!v.media_avatar_asset" class="flex h-full w-full items-center justify-center text-[10px] text-slate-500" x-text="String(v.media_name || '?').slice(0,2)"></div>
                          </div>
                          <div class="min-w-0 flex-1">
                            <div class="line-clamp-2 text-xs font-medium leading-5 text-slate-100" x-text="v.title || v.url"></div>
                            <div class="mt-1 flex items-center gap-2 text-[10px] text-slate-500">
                              <span class="max-w-[45%] truncate" x-text="v.media_name || v.media_id"></span>
                              <span x-text="formatDateTimeShortWithSeconds(playlistVideoTimelineAt(v)) || '-'"></span>
                              <span class="ml-auto" x-text="formatDuration(v.duration_sec) || ''"></span>
                            </div>
                          </div>
                        </div>
                      </button>
                    </template>
                    <div class="p-4 text-xs text-slate-500" x-show="playlistDayVideosLoading">正在加载可播放记录…</div>
                    <div class="p-4 text-xs text-rose-300" x-show="playlistDayVideosError" x-text="playlistDayVideosError"></div>
                    <div class="p-4 text-xs text-slate-500" x-show="!playlistDayVideosLoading && !playlistDayVideosError && !playlistDayVideos.length">这一天没有具备播放资产的记录。</div>
                  </div>
                </section>

                <!-- 播放器与转写：平板/手机播放器在上，转写在下。 -->
                <section class="h-full min-h-0 flex-col bg-slate-950/15 md:order-1 md:h-[62%] lg:order-none lg:h-full" :class="playbackMobileTab==='transcript' ? 'flex' : 'hidden md:flex'" aria-label="播放器与转写">
                  <div class="shrink-0 border-b border-slate-800 bg-black/40">
                    <div class="relative mx-auto aspect-video max-h-[46vh] w-full bg-black lg:max-h-[42vh]" x-show="!playlistAudioOnly">
                      <video x-ref="playlistVideoEl" class="absolute inset-0 h-full w-full" :src="playlistPlayerVideoUrl || null" playsinline preload="metadata" @loadedmetadata="playbackMediaOnLoadedMetadata($event)" @durationchange="playbackMediaOnLoadedMetadata($event)" @timeupdate="playbackMediaOnTimeUpdate($event)" @play="playlistMediaOnPlay($event)" @pause="playlistMediaOnPause($event)" @volumechange="playlistMediaOnVolumeChange($event)" @canplay="playlistMaybeAutoPlay($event)" @ended="playlistOnEnded($event)"></video>
                      <div class="absolute inset-0 flex items-center justify-center px-6 text-center text-xs text-slate-500" x-show="!playlistCurrentVideo">请选择一条来源记录</div>
                    </div>
                    <audio x-ref="playlistAudioEl" class="hidden" :src="playlistPlayerAudioUrl || null" preload="metadata" @loadedmetadata="playbackMediaOnLoadedMetadata($event)" @durationchange="playbackMediaOnLoadedMetadata($event)" @timeupdate="playbackMediaOnTimeUpdate($event)" @play="playlistMediaOnPlay($event)" @pause="playlistMediaOnPause($event)" @volumechange="playlistMediaOnVolumeChange($event)" @canplay="playlistMaybeAutoPlay($event)" @ended="playlistOnEnded($event)"></audio>
                    <div class="flex min-h-28 items-center gap-4 px-5 py-4" x-show="playlistAudioOnly">
                      <div class="h-20 w-20 shrink-0 overflow-hidden rounded-lg bg-slate-900"><img x-show="playlistCurrentAudioThumbnail().url" class="h-full w-full object-cover" :src="playlistCurrentAudioThumbnail().url" alt="" @error="playlistAudioThumbnailOnError()" /></div>
                      <div class="min-w-0"><div class="line-clamp-2 text-sm font-semibold text-slate-100" x-text="playlistCurrentVideo?.title || '请选择一条来源记录'"></div><div class="mt-2 text-xs text-slate-500" x-text="playlistCurrentVideo?.media_name || ''"></div></div>
                    </div>
                    <div class="border-t border-slate-800 bg-slate-950/90 px-3 py-2">
                      <div class="h-1.5 cursor-pointer overflow-hidden rounded-full bg-slate-800" @pointerdown.prevent="playlistSeekPointerDown($event)" aria-label="播放进度"><div class="h-full bg-cyan-400" :style="`width:${playlistMediaProgressPct()}%`"></div></div>
                      <div class="mt-2 flex items-center gap-1.5">
                        <button type="button" class="h-8 rounded px-2 text-xs text-slate-400 hover:bg-slate-800 disabled:opacity-30" @click="playlistPrevVideo()" :disabled="!playlistHasPrevVideo()" aria-label="上一条">⏮</button>
                        <button type="button" class="h-8 rounded px-2 text-xs text-slate-400 hover:bg-slate-800" @click="playlistSeekBy(-15)" aria-label="后退十五秒">−15</button>
                        <button type="button" class="h-8 min-w-10 rounded bg-cyan-500/15 px-2 text-xs text-cyan-100 hover:bg-cyan-500/25" @click="playlistMediaTogglePlay()" x-text="playlistMediaPlaying ? '暂停' : '播放'"></button>
                        <button type="button" class="h-8 rounded px-2 text-xs text-slate-400 hover:bg-slate-800" @click="playlistSeekBy(15)" aria-label="前进十五秒">+15</button>
                        <button type="button" class="h-8 rounded px-2 text-xs text-slate-400 hover:bg-slate-800 disabled:opacity-30" @click="playlistNextVideo()" :disabled="!playlistHasNextVideo()" aria-label="下一条">⏭</button>
                        <span class="ml-1 font-mono text-[10px] text-slate-500" x-text="playlistMediaTimeLabel()"></span>
                        <select class="ml-auto h-8 rounded border border-slate-800 bg-slate-950 px-2 text-[10px] text-slate-300" :value="playbackRate" @change="playbackSetRate($event.target.value)" aria-label="播放速度"><option value="0.75">0.75×</option><option value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
                        <label class="hidden items-center gap-1 text-[10px] text-slate-500 sm:flex"><input type="checkbox" class="accent-cyan-400" x-model="playbackAutoAdvance" />自动连播</label>
                      </div>
                      <div class="mt-2 flex items-center justify-between gap-3 text-[10px]" x-show="playlistPlayerError || playlistPlayerNeedsDownload"><span class="text-amber-300" x-text="playlistPlayerError"></span><button type="button" class="shrink-0 rounded border border-amber-500/30 px-2 py-1 text-amber-200" x-show="playlistCanDownloadCurrentVideo()" @click="playlistDownloadCurrentVideo()">重新下载</button></div>
                    </div>
                  </div>

                  <div class="flex min-h-0 flex-1 flex-col">
                    <div class="flex h-10 shrink-0 items-center justify-between border-b border-slate-800 px-3">
                      <span class="text-xs font-semibold text-slate-300">转写</span>
                      <div class="flex items-center gap-1 rounded border border-slate-800 p-0.5">
                        <button type="button" class="rounded px-2 py-1 text-[10px]" :class="playlistTranscriptVariantActive('plain') ? 'bg-slate-800 text-slate-100' : 'text-slate-500'" :disabled="!playlistTranscriptVariantAvailable('plain')" @click="playlistSwitchTranscriptVariant('plain')">原文</button>
                        <button type="button" class="rounded px-2 py-1 text-[10px]" :class="playlistTranscriptVariantActive('polished') ? 'bg-slate-800 text-slate-100' : 'text-slate-500'" :disabled="!playlistTranscriptVariantAvailable('polished')" @click="playlistSwitchTranscriptVariant('polished')">润色</button>
                      </div>
                    </div>
                    <div class="min-h-0 flex-1 overflow-auto px-4 py-3 raelyn-scrollbar">
                      <div class="text-xs text-slate-500" x-show="playlistTranscriptLoading || playlistTranscriptSwitching">正在加载转写…</div>
                      <div class="text-xs text-rose-300" x-show="playlistTranscriptError" x-text="playlistTranscriptError"></div>
                      <div class="whitespace-pre-wrap text-sm leading-7 text-slate-300" x-show="!playlistTranscriptLoading && !playlistTranscriptSwitching && !playlistTranscriptError" x-text="playlistTranscriptText || '暂无转写文本'"></div>
                    </div>
                  </div>
                </section>
              </div>

              <!-- 手机切换器位于固定日历上方。 -->
              <div class="absolute inset-x-0 bottom-16 z-20 grid h-10 grid-cols-2 border-y border-slate-800 bg-slate-950/95 md:hidden">
                <button type="button" class="text-xs" :class="playbackMobileTab==='records' ? 'bg-cyan-500/15 text-cyan-100' : 'text-slate-500'" @click="playbackSetMobileTab('records')">记录列表</button>
                <button type="button" class="text-xs" :class="playbackMobileTab==='transcript' ? 'bg-cyan-500/15 text-cyan-100' : 'text-slate-500'" @click="playbackSetMobileTab('transcript')">播放器与转写</button>
              </div>

              <!-- 固定 64px 按日日历：保留原播放页的网格、滑动轨道和跳转按钮。 -->
              <footer class="absolute inset-x-0 bottom-0 z-30 h-16 overflow-hidden border-t-[2px] border-slate-700/90 bg-slate-950/10 shadow-[0_-12px_18px_-10px_rgba(0,0,0,0.55)]">
		                  <div class="pointer-events-none absolute inset-x-0 top-[2px] h-2 bg-gradient-to-b from-black/35 to-transparent"></div>
		                  <div class="h-16 grid items-stretch divide-x divide-slate-800 bg-slate-950/15" :style="playlistCalendarLayoutStyle()">
                    <button
                      type="button"
                      class="h-16 text-slate-200 hover:bg-slate-800/40 items-center justify-center hidden sm:inline-flex"
                      @click="playlistJump(playlistJumpDelta('back_big'))"
                      :title="playlistJumpTitle('back_big')"
                      :aria-label="playlistJumpTitle('back_big')"
                    >
                      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M11 17l-5-5 5-5"></path>
                        <path d="M18 17l-5-5 5-5"></path>
                      </svg>
                    </button>
                    <button
                      type="button"
                      class="h-16 text-slate-200 hover:bg-slate-800/40 items-center justify-center hidden sm:inline-flex"
                      @click="playlistJump(playlistJumpDelta('back'))"
                      :title="playlistJumpTitle('back')"
                      :aria-label="playlistJumpTitle('back')"
                    >
                      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M15 18l-6-6 6-6"></path>
                      </svg>
                    </button>

                    <div
                      x-ref="playlistCalendarStrip"
                      class="min-w-0 overflow-hidden select-none"
                      :class="playlistCalendarInteractionBusy() ? 'cursor-grabbing' : 'cursor-grab'"
                      :style="playlistCalendarStripStyle() + ';touch-action:pan-y;'"
                      @pointerdown="playlistCalendarPointerDown($event)"
                    >
                      <div class="relative h-16">
                        <template x-for="track in playlistCalendarTracks()" :key="track.key">
                          <div
                            class="absolute inset-0 grid h-16 grid-flow-col auto-cols-fr divide-x divide-slate-800 will-change-transform"
                            :class="track.interactive ? '' : 'pointer-events-none'"
                            :style="track.style"
                            :aria-hidden="track.interactive ? null : 'true'"
                          >
                            <template x-for="d in track.items" :key="track.key + ':' + d.date">
                              <button
                                type="button"
                                class="h-16 px-2 flex flex-col items-center justify-center text-center relative"
                                :class="(playlistCalendarInteractionBusy() ? '' : 'hover:bg-slate-800/40 transition') + (d.selected ? ' bg-emerald-500/15 shadow-[inset_0_0_0_1px_rgba(16,185,129,0.35)]' : (d.today ? ' bg-sky-500/15 shadow-[inset_0_0_0_1px_rgba(56,189,248,0.25)]' : '')) + (d.disabled ? ' opacity-40 cursor-not-allowed' : '')"
                                @click="track.interactive ? playlistCalendarSelectDate(d.date, $event) : null"
                                :disabled="d.disabled"
                                :tabindex="track.interactive ? null : -1"
                                :title="d.date"
                              >
                                <div class="text-sm font-semibold text-slate-100 whitespace-nowrap leading-4" x-text="d.md"></div>
                                <div class="mt-0.5 text-[11px] text-slate-400 whitespace-nowrap leading-4" x-text="d.weekday"></div>
                                <div class="pointer-events-none absolute top-0.5 right-0.5 sm:top-1 sm:right-1 flex flex-col items-end gap-[1px]" x-show="!d.disabled && playlistCalendarDotCount(d.date) > 0">
                                  <template x-for="(x, i) in playlistCalendarDots(d.date)" :key="i">
                                    <div class="w-[3px] h-[3px] rounded-full bg-teal-600/80 drop-shadow-[0_0_2px_rgba(0,0,0,0.25)]"></div>
                                  </template>
                                </div>
                              </button>
                            </template>
                          </div>
                        </template>
                      </div>
                    </div>

                    <button
                      type="button"
                      class="h-16 text-slate-200 hover:bg-slate-800/40 items-center justify-center hidden sm:inline-flex"
                      @click="playlistJump(playlistJumpDelta('forward'))"
                      :title="playlistJumpTitle('forward')"
                      :aria-label="playlistJumpTitle('forward')"
                    >
                      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M9 18l6-6-6-6"></path>
                      </svg>
                    </button>
                    <button
                      type="button"
                      class="h-16 text-slate-200 hover:bg-slate-800/40 items-center justify-center hidden sm:inline-flex"
                      @click="playlistJump(playlistJumpDelta('forward_big'))"
                      :title="playlistJumpTitle('forward_big')"
                      :aria-label="playlistJumpTitle('forward_big')"
                    >
                      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M6 7l5 5-5 5"></path>
                        <path d="M13 7l5 5-5 5"></path>
                      </svg>
                    </button>
                  </div>
              </footer>
            </div>
          </div>
