          <!-- Videos -->
          <div x-show="activeView==='videos' || (activeView==='library' && libraryTab==='records')" x-transition.opacity class="raelyn-view h-full" :class="activeView==='library' ? 'raelyn-view--library pt-12' : 'raelyn-view--media'">
            <div class="raelyn-surface-base rounded-none overflow-hidden h-full flex flex-col min-h-0 divide-y divide-slate-800">
              <div class="raelyn-toolbar-band shrink-0 px-4 py-2.5">
                <div class="flex flex-wrap items-center gap-2">
                  <div class="mr-auto min-w-[92px] text-xs text-slate-400">
                    <span x-show="videoLoadingList">正在加载…</span>
                    <span x-show="!videoLoadingList" x-text="'已加载 ' + videoList.length + ' 条'"></span>
                  </div>

                  <!-- 媒体范围：观测域是隐式基础范围，这里只表达用户追加的子集筛选。 -->
                  <div class="relative" @click.away="videoMediaTagOpen=false">
                    <button
                      type="button"
                      class="flex h-9 w-[220px] max-w-[70vw] items-center gap-2 rounded-lg border border-slate-700 bg-slate-950/30 px-3 text-xs text-slate-200 transition hover:border-slate-600 hover:bg-slate-900/60 focus:outline-none focus:ring-2 focus:ring-emerald-500/30"
                      :class="videoMediaIds.length ? 'border-emerald-500/35 bg-emerald-500/5' : ''"
                      @click="videoOpenMediaFilter()"
                      aria-haspopup="dialog"
                      :aria-expanded="videoMediaTagOpen"
                    >
                      <svg class="shrink-0 text-slate-400" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M4 7h16M7 12h10M10 17h4"></path>
                      </svg>
                      <span class="min-w-0 flex-1 truncate text-left" x-text="videoMediaFilterLabel()"></span>
                      <svg class="shrink-0 text-slate-500" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
                    </button>

                    <div
                      x-show="videoMediaTagOpen"
                      x-transition.opacity.duration.100ms
                      @keydown.escape.stop="videoMediaTagOpen=false"
                      class="absolute right-0 z-30 mt-2 w-[360px] max-w-[92vw] overflow-hidden rounded-xl border border-slate-700 bg-slate-950 shadow-2xl shadow-black/40"
                      role="dialog"
                      aria-label="筛选媒体"
                    >
                      <div class="border-b border-slate-800 p-3">
                        <div class="mb-2 flex items-center justify-between gap-3">
                          <div>
                            <div class="text-sm font-medium text-slate-100">筛选媒体</div>
                            <div class="mt-0.5 text-[11px] text-slate-500" x-text="videoMediaDraftIds.length ? ('已选 ' + videoMediaDraftIds.length + ' 个') : '当前范围内全部媒体'"></div>
                          </div>
                          <button type="button" class="text-xs text-slate-400 hover:text-slate-200" @click="videoClearMediaDraft()">清除选择</button>
                        </div>
                        <div class="relative">
                          <svg class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
                          <input
                            class="h-9 w-full rounded-lg border border-slate-700 bg-slate-900/60 pl-9 pr-3 text-xs text-slate-100 placeholder-slate-500 focus:border-emerald-500/40 focus:outline-none focus:ring-2 focus:ring-emerald-500/20"
                            placeholder="搜索媒体名称或平台"
                            x-model="videoMediaTagQuery"
                            x-ref="videoMediaFilterSearch"
                          />
                        </div>
                      </div>

                      <div class="max-h-72 overflow-y-auto p-1.5 raelyn-scrollbar">
                        <button
                          type="button"
                          class="mb-1 flex w-full items-center gap-3 rounded-lg px-2.5 py-2 text-left hover:bg-slate-900"
                          :class="videoMediaDraftIds.length===0 ? 'bg-emerald-500/10 text-emerald-100' : 'text-slate-200'"
                          @click="videoClearMediaDraft()"
                        >
                          <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-slate-800 text-slate-300">
                            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
                          </span>
                          <span class="min-w-0 flex-1">
                            <span class="block text-xs font-medium">全部媒体</span>
                            <span class="block text-[11px] text-slate-500" x-text="videoMediaOptionIndex().length + ' 个媒体'"></span>
                          </span>
                          <span class="flex h-4 w-4 items-center justify-center rounded border" :class="videoMediaDraftIds.length===0 ? 'border-emerald-400 bg-emerald-500 text-slate-950' : 'border-slate-600'">
                            <svg x-show="videoMediaDraftIds.length===0" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="m5 12 4 4L19 6"></path></svg>
                          </span>
                        </button>

                        <template x-for="m in videoFilteredMediaOptions()" :key="m.id">
                          <button
                            type="button"
                            class="flex w-full items-center gap-3 rounded-lg px-2.5 py-2 text-left hover:bg-slate-900"
                            :class="videoMediaDraftSelected(m.id) ? 'bg-slate-900/80' : ''"
                            @click="videoToggleMediaDraft(m.id)"
                          >
                            <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-[11px] font-semibold ring-1" :class="mediaAvatarClasses(m)" x-text="mediaAvatarLabel(m)"></span>
                            <span class="min-w-0 flex-1">
                              <span class="block truncate text-xs text-slate-100" x-text="mediaDisplayName(m)"></span>
                              <span class="block truncate text-[11px] text-slate-500" x-text="m.provider"></span>
                            </span>
                            <span class="flex h-4 w-4 items-center justify-center rounded border" :class="videoMediaDraftSelected(m.id) ? 'border-emerald-400 bg-emerald-500 text-slate-950' : 'border-slate-600'">
                              <svg x-show="videoMediaDraftSelected(m.id)" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="m5 12 4 4L19 6"></path></svg>
                            </span>
                          </button>
                        </template>
                        <div x-show="videoFilteredMediaOptions().length===0" class="px-3 py-8 text-center text-xs text-slate-500">没有匹配的媒体</div>
                      </div>

                      <div class="flex items-center justify-end gap-2 border-t border-slate-800 p-2.5">
                        <button type="button" class="rounded-lg px-3 py-1.5 text-xs text-slate-400 hover:bg-slate-900 hover:text-slate-200" @click="videoMediaTagOpen=false">取消</button>
                        <button type="button" class="rounded-lg bg-emerald-500 px-3.5 py-1.5 text-xs font-medium text-slate-950 hover:bg-emerald-400" @click="videoApplyMediaFilter()">应用筛选</button>
                      </div>
                    </div>
                  </div>

                  <div class="relative min-w-[124px]">
                    <select
                      class="h-9 w-full appearance-none rounded-lg border border-slate-700 bg-slate-950/30 px-3 pr-9 text-xs text-slate-200 focus:border-emerald-500/30 focus:outline-none focus:ring-2 focus:ring-emerald-500/20"
                      x-model="videoStatus"
                      @change="loadVideos()"
                    >
                      <option value="">状态：全部</option>
                      <option value="discovered">状态：已发现</option>
                      <option value="downloading">状态：下载中</option>
                      <option value="downloaded">状态：已下载</option>
                      <option value="ready">状态：已就绪</option>
                      <option value="failed">状态：失败</option>
                    </select>
                    <svg class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-slate-500" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
                  </div>

                  <div class="relative" @click.away="videoTimeFilterOpen=false">
                    <button
                      type="button"
                      class="flex h-9 min-w-[148px] items-center gap-2 rounded-lg border border-slate-700 bg-slate-950/30 px-3 text-xs text-slate-200 hover:border-slate-600 hover:bg-slate-900/60 focus:outline-none focus:ring-2 focus:ring-emerald-500/20"
                      @click="videoOpenTimeFilter()"
                      aria-haspopup="dialog"
                      :aria-expanded="videoTimeFilterOpen"
                    >
                      <svg class="shrink-0 text-slate-500" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
                      <span class="flex-1 text-left" x-text="videoTimeFilterLabel()"></span>
                      <svg class="shrink-0 text-slate-500" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
                    </button>

                    <div
                      x-show="videoTimeFilterOpen"
                      x-transition.opacity.duration.100ms
                      @keydown.escape.stop="videoTimeFilterOpen=false"
                      class="absolute right-0 z-30 mt-2 w-[350px] max-w-[92vw] rounded-xl border border-slate-700 bg-slate-950 p-3 shadow-2xl shadow-black/40"
                      role="dialog"
                      aria-label="筛选时间"
                    >
                      <div class="mb-2 text-sm font-medium text-slate-100">发布时间</div>
                      <div class="grid grid-cols-4 gap-1.5">
                        <button type="button" class="rounded-lg border border-slate-700 px-2 py-2 text-[11px] text-slate-300 hover:border-emerald-500/40 hover:bg-emerald-500/10" @click="videoSetTimePreset(24)">24 小时</button>
                        <button type="button" class="rounded-lg border border-slate-700 px-2 py-2 text-[11px] text-slate-300 hover:border-emerald-500/40 hover:bg-emerald-500/10" @click="videoSetTimePreset(168)">7 天</button>
                        <button type="button" class="rounded-lg border border-slate-700 px-2 py-2 text-[11px] text-slate-300 hover:border-emerald-500/40 hover:bg-emerald-500/10" @click="videoSetTimePreset(720)">30 天</button>
                        <button type="button" class="rounded-lg border border-slate-700 px-2 py-2 text-[11px] text-slate-300 hover:border-emerald-500/40 hover:bg-emerald-500/10" @click="videoSetTimePreset(null)">全部</button>
                      </div>
                      <div class="my-3 flex items-center gap-3 text-[11px] text-slate-600"><span class="h-px flex-1 bg-slate-800"></span><span>自定义范围</span><span class="h-px flex-1 bg-slate-800"></span></div>
                      <div class="space-y-2">
                        <label class="grid grid-cols-[48px_1fr] items-center gap-2 text-xs text-slate-400">
                          <span>开始</span>
                          <input type="datetime-local" x-model="videoTimeDraftFrom" class="h-9 rounded-lg border border-slate-700 bg-slate-900/60 px-2 text-xs text-slate-100 focus:border-emerald-500/40 focus:outline-none" />
                        </label>
                        <label class="grid grid-cols-[48px_1fr] items-center gap-2 text-xs text-slate-400">
                          <span>结束</span>
                          <input type="datetime-local" x-model="videoTimeDraftTo" class="h-9 rounded-lg border border-slate-700 bg-slate-900/60 px-2 text-xs text-slate-100 focus:border-emerald-500/40 focus:outline-none" />
                        </label>
                      </div>
                      <div class="mt-3 flex justify-end gap-2 border-t border-slate-800 pt-3">
                        <button type="button" class="rounded-lg px-3 py-1.5 text-xs text-slate-400 hover:bg-slate-900 hover:text-slate-200" @click="videoTimeFilterOpen=false">取消</button>
                        <button type="button" class="rounded-lg bg-emerald-500 px-3.5 py-1.5 text-xs font-medium text-slate-950 hover:bg-emerald-400" @click="videoApplyTimeFilter()">应用时间</button>
                      </div>
                    </div>
                  </div>

                  <div class="relative min-w-[190px] flex-1 sm:max-w-[280px]">
                    <svg class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
                    <input
                      class="h-9 w-full rounded-lg border border-slate-700 bg-slate-950/30 pl-9 pr-3 text-xs text-slate-100 placeholder-slate-500 focus:border-emerald-500/30 focus:outline-none focus:ring-2 focus:ring-emerald-500/20"
                      placeholder="搜索视频标题"
                      x-model="videoQuery"
                      @input.debounce.400ms="loadVideos()"
                    />
                  </div>

                  <button type="button" class="h-9 rounded-lg px-3 text-xs text-slate-400 hover:bg-slate-800/70 hover:text-slate-200" @click="videoResetFilters()" title="恢复默认筛选">重置</button>
                </div>
              </div>

              <div class="p-4 flex-1 min-h-0 overflow-auto raelyn-scrollbar">
                <div x-show="videoLoadingList" class="text-sm text-slate-300">加载中…</div>
                <div x-show="!videoLoadingList && videoList.length===0" class="text-sm text-slate-400">暂无视频</div>
                <div
                  class="grid grid-cols-1 min-[640px]:grid-cols-2 min-[1024px]:grid-cols-3 min-[1536px]:grid-cols-4 gap-4 items-start"
                  x-show="!videoLoadingList && videoList.length>0"
                >
                  <template x-for="v in videoList" :key="v.id">
                    <div
                      class="video-card rounded-xl border border-slate-800 bg-slate-900/40 overflow-hidden cursor-pointer"
                      @click="openVideoPlayer(v)"
                    >
                      <div class="relative bg-slate-950/30">
                        <div class="aspect-video bg-slate-950/20">
                          <template x-if="v.cover_asset">
                            <img
                              class="w-full h-full object-cover"
                              :src="assetContentUrl(v.cover_asset)"
                              alt=""
                              loading="lazy"
                              @error="clearAssetRef(v, 'cover_asset')"
                            />
                          </template>
                          <template x-if="!v.cover_asset && v.thumbnail_url">
                            <img
                              class="w-full h-full object-cover"
                              :src="v.thumbnail_url"
                              alt=""
                              loading="lazy"
                              @error="v.thumbnail_url=''"
                            />
                          </template>
                          <template x-if="!v.cover_asset && !v.thumbnail_url">
                            <div class="w-full h-full flex items-center justify-center text-sm text-slate-500">无封面</div>
                          </template>
                        </div>
                        <div
                          class="absolute top-2 right-2 text-[11px] px-2 py-0.5 rounded-full bg-slate-950/40 text-slate-200"
                          x-text="v.status"
                        ></div>
                        <div
                          class="absolute bottom-2 left-2 text-[11px] px-2 py-0.5 rounded-md border border-slate-700 bg-slate-950/50 text-slate-200"
                          x-text="formatDateTimeShort(v.published_at)"
                          x-show="v.published_at"
                        ></div>
                        <div
                          class="absolute bottom-2 right-2 text-[11px] px-2 py-0.5 rounded-md border border-slate-700 bg-slate-950/50 text-slate-200"
                          x-text="formatDuration(v.duration_sec)"
                        ></div>
                      </div>
                      <div class="p-3">
                        <div class="text-sm font-medium leading-5 truncate" x-text="v.title || v.provider_video_id"></div>
                        <div class="mt-2 flex items-center gap-2">
                          <div
                            class="w-8 h-8 rounded-md ring-1 ring-inset"
                            :class="mediaAvatarClasses({provider: v.provider})"
                          >
                            <template x-if="v.media_avatar_asset">
                              <img class="w-8 h-8 rounded-md object-cover" :src="assetContentUrl(v.media_avatar_asset)" alt="" loading="lazy" @error="clearAssetRef(v, 'media_avatar_asset')" />
                            </template>
                            <template x-if="!v.media_avatar_asset">
                              <div class="w-8 h-8 flex items-center justify-center">
                                <span class="text-[10px] font-semibold" x-text="videoMediaAvatarLabel(v)"></span>
                              </div>
                            </template>
                          </div>
                          <div class="min-w-0 flex-1">
                            <div class="text-xs text-slate-200 truncate" x-text="videoMediaDisplayName(v)"></div>
                            <div class="text-[11px] text-slate-400 truncate" x-text="formatDateTime(v.published_at)"></div>
                          </div>
                          <template x-if="v.video_asset">
                            <a
                              class="px-3 py-1.5 rounded-md border border-slate-700 bg-slate-950/20 text-xs text-slate-200 hover:bg-slate-800/60"
                              :href="assetDownloadUrl(v.video_asset)"
                              target="_blank"
                              rel="noopener noreferrer"
                              @click.stop
                            >
                              下载
                            </a>
                          </template>
                        </div>
                      </div>
                    </div>
                  </template>
                </div>

                <div class="pt-4 flex flex-col items-center gap-2">
                  <div x-ref="videoInfiniteSentinel" class="h-1 w-1 opacity-0"></div>
                  <div class="text-xs text-slate-400" x-show="videoLoadingMore">加载更多…</div>
                  <div class="text-xs text-slate-500" x-show="!videoLoadingList && videoList.length>0 && !videoHasMore && !videoLoadingMore">
                    没有更多了
                  </div>
                </div>
              </div>
            </div>
          </div>
