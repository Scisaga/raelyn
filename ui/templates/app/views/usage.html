                  <div class="min-w-0">
                    <div class="flex items-center gap-2"><h1 class="text-xs font-semibold text-slate-100">资源观测站</h1><span class="inline-flex items-center gap-1 rounded-full border border-cyan-400/20 bg-cyan-400/8 px-1.5 py-0.5 text-[9px] text-cyan-200"><span class="h-1 w-1 rounded-full bg-cyan-300"></span>全局遥测</span></div>
                    <div class="mt-0.5 truncate font-mono text-[9px] text-slate-500" x-text="usageGeneratedLabel()"></div>

                  <button type="button" class="inline-flex h-7 items-center gap-1.5 rounded-md border border-slate-700 bg-slate-950/30 px-2.5 text-[10px] text-slate-300 transition hover:border-cyan-400/35 hover:text-cyan-100 disabled:cursor-wait disabled:opacity-60" :disabled="usageLoading" @click="refreshUsage()"><svg aria-hidden="true" class="h-3.5 w-3.5" :class="usageLoading ? 'animate-spin' : ''" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.34 5.66"/><path d="M20 4v7h-7"/></svg><span x-text="usageLoading ? '刷新中…' : '刷新'"></span></button>

              <main class="raelyn-usage-dashboard raelyn-scrollbar relative grid flex-1 min-h-0 gap-2 overflow-auto p-2 xl:grid-rows-[82px_54px_minmax(0,1fr)_240px] xl:overflow-hidden">
                <section class="grid grid-cols-2 gap-2 md:grid-cols-3 xl:grid-cols-6" aria-label="资源用量摘要">
                  <article class="raelyn-usage-metric flex min-h-[78px] items-center gap-3 rounded-lg border border-cyan-400/12 px-3 py-2 tabular-nums"><div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md bg-cyan-400/8 text-cyan-200"><svg aria-hidden="true" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3Z"/></svg></div><div class="min-w-0"><div class="text-[9px] uppercase tracking-[0.12em] text-slate-500">已下载视频</div><div class="mt-1 truncate font-mono text-xl font-semibold text-slate-100" x-text="usageCountLabel(usageSummary.downloadedVideoCount)"></div><div class="mt-0.5 font-mono text-[9px] text-cyan-200">+<span x-text="usageCountLabel(usageSummary.videoDownloaded)"></span><span class="ml-1 text-slate-600">本窗口下载</span></div></div></article>
                  <article class="raelyn-usage-metric flex min-h-[78px] items-center gap-3 rounded-lg border border-sky-400/12 px-3 py-2 tabular-nums"><div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md bg-sky-400/8 text-sky-200"><svg aria-hidden="true" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="19" cy="19" r="2"/><path d="m7 11 10-5M7 13l10 5"/></svg></div><div class="min-w-0"><div class="text-[9px] uppercase tracking-[0.12em] text-slate-500">外部调用</div><div class="mt-1 truncate font-mono text-xl font-semibold text-sky-100" x-text="usageCountLabel(usageSummary.externalCalls)"></div><div class="mt-0.5 truncate font-mono text-[8px] text-slate-500">LLM <span x-text="usageCountLabel(usageSummary.llmCalls)"></span> · ASR <span x-text="usageCountLabel(usageSummary.asrCalls)"></span> · 向量 <span x-text="usageCountLabel(usageSummary.embeddingCalls)"></span></div></div></article>
                  <article class="raelyn-usage-metric flex min-h-[78px] items-center gap-3 rounded-lg border border-violet-400/12 px-3 py-2 tabular-nums"><div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md bg-violet-400/8 text-violet-200"><svg aria-hidden="true" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h10"/><circle cx="18" cy="17" r="2"/></svg></div><div class="min-w-0"><div class="text-[9px] uppercase tracking-[0.12em] text-slate-500">LLM Token</div><div class="mt-1 truncate font-mono text-xl font-semibold text-violet-100" x-text="usageCountLabel(usageSummary.llmTotalTokens)"></div><div class="mt-0.5 truncate font-mono text-[9px] text-slate-500">入 <span x-text="usageCountLabel(usageSummary.llmInputTokens)"></span> · 出 <span x-text="usageCountLabel(usageSummary.llmOutputTokens)"></span></div></div></article>
                  <article class="raelyn-usage-metric flex min-h-[78px] items-center gap-3 rounded-lg border border-blue-400/12 px-3 py-2 tabular-nums"><div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md bg-blue-400/8 text-blue-200"><svg aria-hidden="true" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 8 4-8 4-8-4 8-4Z"/><path d="m4 12 8 4 8-4M4 17l8 4 8-4"/></svg></div><div class="min-w-0"><div class="text-[9px] uppercase tracking-[0.12em] text-slate-500">逻辑资产</div><div class="mt-1 truncate font-mono text-xl font-semibold text-blue-100" x-text="usageBytesLabel(usageSummary.assetSizeBytes)"></div><div class="mt-0.5 font-mono text-[9px] text-slate-500"><span x-text="formatInteger(usageSummary.assetCount)"></span> 个对象</div></div></article>
                  <article class="raelyn-usage-metric flex min-h-[78px] items-center gap-3 rounded-lg border border-emerald-400/12 px-3 py-2 tabular-nums"><div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md bg-emerald-400/8 text-emerald-200"><svg aria-hidden="true" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v7c0 1.66 3.13 3 7 3s7-1.34 7-3V5M5 12v7c0 1.66 3.13 3 7 3s7-1.34 7-3v-7"/></svg></div><div class="min-w-0"><div class="text-[9px] uppercase tracking-[0.12em] text-slate-500">数据库</div><div class="mt-1 truncate font-mono text-xl font-semibold text-emerald-100" x-text="usageDatabaseSizeLabel()"></div><div class="mt-0.5 text-[9px] text-slate-500">当前实际占用</div></div></article>
                  <article class="raelyn-usage-metric flex min-h-[78px] items-center gap-3 rounded-lg border border-amber-400/12 px-3 py-2 tabular-nums"><div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md bg-amber-400/8 text-amber-200"><svg aria-hidden="true" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 2.8 17a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4m0 3h.01"/></svg></div><div class="min-w-0"><div class="text-[9px] uppercase tracking-[0.12em] text-slate-500">大小未知资产</div><div class="mt-1 truncate font-mono text-xl font-semibold" :class="usageSummary.assetMissingSizeCount ? 'text-amber-200' : 'text-slate-300'" x-text="usageCountLabel(usageSummary.assetMissingSizeCount)"></div><div class="mt-0.5 text-[9px] text-slate-500">未记录文件大小</div></div></article>

                <section class="raelyn-usage-signal-rail grid overflow-hidden rounded-lg border border-slate-800 lg:grid-cols-3 lg:divide-x lg:divide-slate-800" aria-label="采集链路状态">
                  <div class="flex min-w-0 items-center gap-2 border-b border-slate-800 px-3 py-2 lg:border-b-0"><span class="h-2 w-2 shrink-0 rounded-full bg-violet-300"></span><div class="min-w-0 flex-1"><div class="flex items-center justify-between gap-2"><span class="text-[10px] font-medium text-slate-300">调用遥测</span><span class="rounded-full border border-violet-400/20 bg-violet-400/8 px-1.5 py-0.5 text-[8px] text-violet-200" x-text="usageCollectionModeLabel()"></span></div><div class="mt-1 truncate font-mono text-[8px] text-slate-600">起 <span class="text-slate-400" x-text="usageDateLabel(usageCollection.usageStartedAt)"></span> · 最近 <span class="text-slate-400" x-text="usageDateTimeLabel(usageCollection.lastUsageAt)"></span></div></div></div>
                  <div class="flex min-w-0 items-center gap-2 border-b border-slate-800 px-3 py-2 lg:border-b-0"><span class="h-2 w-2 shrink-0 rounded-full" :class="usageCollection.lastResourceSnapshotAt ? 'bg-cyan-300' : 'bg-slate-600'"></span><div class="min-w-0 flex-1"><div class="flex items-center justify-between gap-2"><span class="text-[10px] font-medium text-slate-300">资源快照</span><span class="rounded-full border px-1.5 py-0.5 text-[8px]" :class="usageCollection.lastResourceSnapshotAt ? 'border-emerald-400/20 bg-emerald-400/8 text-emerald-200' : 'border-slate-700 text-slate-500'" x-text="usageCollection.lastResourceSnapshotAt ? '链路正常' : '等待快照'"></span></div><div class="mt-1 truncate font-mono text-[8px] text-slate-600">起 <span class="text-slate-400" x-text="usageDateLabel(usageCollection.resourceStartedAt)"></span> · 最近 <span class="text-slate-400" x-text="usageDateTimeLabel(usageCollection.lastResourceSnapshotAt)"></span></div></div></div>
                  <div class="flex min-w-0 items-center gap-2 px-3 py-2"><span class="h-2 w-2 shrink-0 rounded-full bg-slate-600"></span><div class="min-w-0 flex-1"><div class="flex items-center justify-between gap-2"><span class="text-[10px] font-medium text-slate-300">主机物理磁盘</span><span class="rounded-full border border-slate-700 px-1.5 py-0.5 text-[8px] text-slate-500" x-text="usageCollection.physicalStorageAvailable ? '已接入' : '未接入'"></span></div><div class="mt-1 truncate text-[8px] text-slate-600" x-text="usageCollection.physicalStorageReason || '未接入部署侧指标'"></div></div></div>
                </section>

                <section class="grid min-h-[460px] grid-cols-1 gap-2 lg:grid-cols-2 xl:min-h-0 xl:grid-rows-2" aria-label="资源用量趋势">
                  <article class="raelyn-usage-chart-panel flex min-h-[220px] min-w-0 flex-col rounded-lg border border-sky-400/12 p-3 2xl:min-h-0"><div class="flex shrink-0 items-center justify-between gap-3"><div><h2 class="text-[10px] font-medium text-slate-200">外部服务节奏</h2><div class="mt-0.5 text-[8px] text-slate-500" x-text="usageCallTrendGranularityLabel() + ' · 分服务调用'"></div></div><div class="flex items-center gap-2 text-[8px] text-slate-400"><span x-cloak class="inline-flex items-center gap-1" x-show="usageSummary.llmCalls !== null"><span class="h-0.5 w-3 bg-violet-400"></span>LLM</span><span x-cloak class="inline-flex items-center gap-1" x-show="usageSummary.asrCalls !== null"><span class="h-0.5 w-3 bg-teal-400"></span>ASR</span><span x-cloak class="inline-flex items-center gap-1" x-show="usageSummary.embeddingCalls !== null"><span class="h-0.5 w-3 bg-emerald-400"></span>向量</span></div></div><div class="mt-1 h-40 min-h-0 flex-1" x-show="usageHasCallsSeries()" x-ref="usageCallsChart" role="img" aria-label="外部服务调用移动均值趋势图"></div><div class="mt-1 flex h-40 min-h-0 flex-1 items-center justify-center text-[10px] text-slate-500" x-show="!usageHasCallsSeries()" x-text="usageLoading ? '加载中…' : '暂无调用采样'"></div></article>
                  <article class="raelyn-usage-chart-panel flex min-h-[220px] min-w-0 flex-col rounded-lg border border-violet-400/12 p-3 2xl:min-h-0"><div class="flex shrink-0 items-center justify-between gap-3"><div><h2 class="text-[10px] font-medium text-slate-200">Token 趋势</h2><div class="mt-0.5 text-[8px] text-slate-500">输入 / 输出</div></div><div class="flex items-center gap-2 text-[8px] text-slate-400"><span class="h-0.5 w-3 bg-teal-400"></span>输入<span class="h-0.5 w-3 bg-amber-400"></span>输出</div></div><div class="mt-1 h-40 min-h-0 flex-1" x-show="usageHasTokenSeries()" x-ref="usageTokensChart" role="img" aria-label="按日 LLM Token 趋势图"></div><div class="mt-1 flex h-40 min-h-0 flex-1 items-center justify-center text-[10px] text-slate-500" x-show="!usageHasTokenSeries()" x-text="usageLoading ? '加载中…' : '暂无 Token 采样'"></div></article>
                  <article class="raelyn-usage-chart-panel flex min-h-[220px] min-w-0 flex-col rounded-lg border border-cyan-400/12 p-3 2xl:min-h-0"><div class="flex shrink-0 items-center justify-between gap-3"><div><h2 class="text-[10px] font-medium text-slate-200">视频下载量</h2><div class="mt-0.5 text-[8px] text-slate-500">每天成功完成的下载任务数</div></div><span class="inline-flex items-center gap-1 text-[8px] text-slate-400"><span class="h-0.5 w-3 bg-cyan-400"></span>实际下载</span></div><div class="mt-1 h-40 min-h-0 flex-1" x-show="usageHasVideoSeries()" x-ref="usageVideoChart" role="img" aria-label="每日实际成功视频下载量趋势图"></div><div class="mt-1 flex h-40 min-h-0 flex-1 items-center justify-center text-[10px] text-slate-500" x-show="!usageHasVideoSeries()" x-text="usageLoading ? '加载中…' : '暂无成功下载'"></div></article>
                  <article class="raelyn-usage-chart-panel flex min-h-[220px] min-w-0 flex-col rounded-lg border border-emerald-400/12 p-3 2xl:min-h-0"><div class="flex shrink-0 items-center justify-between gap-3"><div><h2 class="text-[10px] font-medium text-slate-200">逻辑容量趋势</h2><div class="mt-0.5 text-[8px] text-slate-500">资产 / PostgreSQL</div></div><div class="flex items-center gap-2 text-[8px] text-slate-400"><span class="h-0.5 w-3 bg-sky-400"></span>资产<span class="h-0.5 w-3 bg-emerald-400"></span>数据库</div></div><div class="mt-1 h-40 min-h-0 flex-1" x-show="usageHasStorageSeries()" x-ref="usageStorageChart" role="img" aria-label="按日逻辑资产与数据库规模趋势图"></div><div class="mt-1 flex h-40 min-h-0 flex-1 items-center justify-center text-[10px] text-slate-500" x-show="!usageHasStorageSeries()" x-text="usageLoading ? '加载中…' : '暂无资源快照'"></div></article>
                </section>

                <div x-cloak class="absolute bottom-2 left-2 right-2 z-10 rounded-md border border-rose-500/20 bg-slate-950/95 px-3 py-2 text-xs text-rose-200 shadow-lg" x-show="usageChartError" x-text="usageChartError"></div>

                <section class="grid min-h-[300px] grid-cols-1 gap-2 xl:min-h-0 xl:grid-cols-12" aria-label="资源构成明细">
                  <article class="raelyn-card-surface flex min-h-0 flex-col overflow-hidden rounded-lg border border-slate-800 xl:col-span-8" aria-labelledby="usage-service-title"><div class="flex h-9 shrink-0 items-center justify-between gap-3 border-b border-slate-800 px-3"><div><h2 id="usage-service-title" class="text-[10px] font-medium text-slate-200">服务调用画像</h2><div class="text-[8px] text-slate-500">历史与实时独立聚合</div></div><span class="font-mono text-[9px] text-slate-500" x-text="formatInteger(usageServiceBreakdown.length) + ' 条链路'"></span></div><div class="raelyn-scrollbar min-h-0 flex-1 overflow-auto" x-show="usageServiceBreakdown.length"><table class="w-full min-w-[720px] text-left text-[9px]"><thead class="sticky top-0 bg-slate-950/95 text-slate-500"><tr><th class="px-3 py-1.5 font-medium">调用链路</th><th class="px-3 py-1.5 text-right font-medium">调用</th><th class="px-3 py-1.5 text-right font-medium">成功率</th><th class="px-3 py-1.5 text-right font-medium">Token</th><th class="px-3 py-1.5 text-right font-medium">耗时</th><th class="px-3 py-1.5 text-right font-medium">最近活动</th></tr></thead><tbody class="divide-y divide-slate-800"><template x-for="(row,index) in usageServiceBreakdown" :key="row.service+':'+row.operation+':'+row.provider+':'+row.model+':'+index"><tr class="hover:bg-slate-900/45"><td class="px-3 py-1.5"><div class="flex items-center gap-1.5"><span class="h-1.5 w-1.5 rounded-full" :class="row.service==='llm' ? 'bg-violet-400' : row.service==='asr' ? 'bg-cyan-400' : 'bg-emerald-400'"></span><span class="text-slate-200" x-text="usageOperationLabel(row.operation)"></span><span class="font-mono text-[8px] uppercase text-slate-600" x-text="row.service"></span></div><div class="ml-3 mt-0.5 font-mono text-[8px] text-slate-600" x-text="usageProviderLabel(row)"></div></td><td class="px-3 py-1.5 text-right font-mono text-slate-200" x-text="formatInteger(row.calls)"></td><td class="px-3 py-1.5 text-right font-mono" :class="row.failures ? 'text-amber-200' : 'text-emerald-200'" x-text="usageSuccessRateLabel(row)"></td><td class="px-3 py-1.5 text-right font-mono text-violet-100" x-text="row.service==='llm' ? formatCompactInteger(row.totalTokens) : '—'"></td><td class="px-3 py-1.5 text-right font-mono text-slate-500" x-text="usageDurationLabel(row.durationMs,row.operation)"></td><td class="px-3 py-1.5 text-right font-mono text-slate-500" x-text="usageDateTimeLabel(row.lastCalledAt)"></td></tr></template></tbody></table></div><div class="flex flex-1 items-center justify-center text-[10px] text-slate-500" x-show="!usageServiceBreakdown.length" x-text="usageLoading ? '加载中…' : '暂无服务调用明细'"></div></article>
                  <article class="raelyn-card-surface flex min-h-0 flex-col overflow-hidden rounded-lg border border-slate-800 xl:col-span-4" aria-labelledby="usage-asset-title"><div class="flex h-9 shrink-0 items-center justify-between gap-3 border-b border-slate-800 px-3"><div><h2 id="usage-asset-title" class="text-[10px] font-medium text-slate-200">资产构成</h2><div class="text-[8px] text-slate-500">按已知大小排列</div></div><span class="font-mono text-[9px] text-slate-500" x-text="formatInteger(usageAssetBreakdown.length) + ' 类'"></span></div><div class="raelyn-scrollbar min-h-0 flex-1 divide-y divide-slate-800 overflow-auto" x-show="usageAssetBreakdown.length"><template x-for="row in usageAssetBreakdown" :key="row.assetType"><div class="px-3 py-1.5 hover:bg-slate-900/35"><div class="flex items-center justify-between gap-3"><div class="min-w-0"><div class="truncate text-[9px] text-slate-200" x-text="usageAssetLabel(row.assetType)"></div><div class="font-mono text-[8px] text-slate-600"><span x-text="formatInteger(row.count)"></span> 项<span class="ml-2 text-amber-300" x-show="row.missingSizeCount" x-text="formatInteger(row.missingSizeCount)+' 缺大小'"></span></div></div><div class="font-mono text-[9px] text-sky-100" x-text="formatBytes(row.sizeBytes)"></div></div><div class="mt-1 h-0.5 overflow-hidden rounded-full bg-slate-950/80"><div class="h-full rounded-full bg-gradient-to-r from-sky-500/55 to-cyan-300/85" :style="'width:'+usageAssetShare(row)+'%'"></div></div></div></template></div><div class="flex flex-1 items-center justify-center text-[10px] text-slate-500" x-show="!usageAssetBreakdown.length" x-text="usageLoading ? '加载中…' : '暂无逻辑资产'"></div></article>
                </section>
              </main>
            </div>
          </div>
