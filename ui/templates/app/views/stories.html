          <div x-show="activeView==='stories'" x-transition.opacity class="h-full bg-[#030711]">
            <div class="grid h-full min-h-0 grid-cols-1 lg:grid-cols-[20rem_minmax(0,1fr)]">
              <aside class="flex min-h-0 flex-col border-r border-slate-800 bg-slate-950/55">
                <div class="border-b border-slate-800 px-4 py-3">
                  <div class="flex items-center justify-between"><div><div class="text-xs font-semibold text-slate-100">故事航迹</div><div class="mt-1 text-[10px] text-slate-600" x-text="currentDomainLabel()"></div></div><span class="rounded-full border border-violet-500/20 bg-violet-500/10 px-2 py-0.5 font-mono text-[10px] text-violet-200" x-text="stories.length"></span></div>
                </div>
                <div class="flex-1 overflow-auto raelyn-scrollbar">
                  <div class="px-4 py-8 text-center text-xs text-slate-600" x-show="storiesLoading">正在读取稳定故事身份…</div>
                  <template x-for="story in stories" :key="story.story_identity_id">
                    <button type="button" class="block w-full border-b border-slate-900 px-4 py-3 text-left transition" :class="storySelectedId===story.story_identity_id ? 'bg-violet-500/8 border-l-2 border-l-violet-400' : 'hover:bg-slate-900/60'" @click="loadStoryDetail(story.story_identity_id,{markRead:true})">
                      <div class="flex items-start gap-2"><span class="mt-1 h-1.5 w-1.5 shrink-0 rounded-full" :class="story.unread ? 'bg-violet-300 shadow-[0_0_8px_rgba(196,181,253,.7)]' : 'bg-slate-700'"></span><span class="min-w-0 flex-1 text-xs font-medium leading-5 text-slate-200" x-text="story.title"></span><span class="text-[10px] text-amber-200" x-show="story.followed">关注</span></div>
                      <div class="mt-1.5 line-clamp-2 text-[10px] leading-4 text-slate-600" x-text="story.summary"></div>
                      <div class="mt-2 flex items-center justify-between font-mono text-[10px] text-slate-600"><span x-text="String(story.event_time_start || '').slice(0,10)+' → '+String(story.event_time_end || '').slice(0,10)"></span><span x-text="story.canonical_count+' 节点'"></span></div>
                    </button>
                  </template>
                  <div class="px-4 py-8 text-center text-xs text-slate-600" x-show="!storiesLoading && !stories.length">当前观测域还没有形成有证据关系的故事</div>
                </div>
              </aside>

              <main class="min-h-0 overflow-auto raelyn-scrollbar">
                <div class="mx-auto max-w-5xl px-5 py-6 lg:px-8" x-show="storyDetail">
                  <div class="flex flex-wrap items-start justify-between gap-4 border-b border-slate-800 pb-5">
                    <div class="min-w-0"><div class="text-[10px] uppercase tracking-[0.18em] text-violet-400">Stable Story · <span class="font-mono" x-text="String(storySelectedId).slice(0,8)"></span></div><h1 class="mt-2 text-xl font-semibold leading-8 text-slate-100" x-text="storyDetail?.revisions?.[storyDetail.revisions.length-1]?.title || '故事'"></h1><p class="mt-2 max-w-3xl text-sm leading-6 text-slate-400" x-text="storyDetail?.revisions?.[storyDetail.revisions.length-1]?.summary || '仅呈现冻结成员与有证据关系，不表达市场因果。'"></p></div>
                    <div class="flex items-center gap-2"><button type="button" class="rounded-full border px-3 py-1.5 text-xs" :class="storyDetail?.followed ? 'border-amber-400/30 bg-amber-400/10 text-amber-100' : 'border-slate-700 text-slate-400'" @click="storyUpdateReadState({followed:!storyDetail.followed})" x-text="storyDetail?.followed ? '已关注' : '关注'"></button><button type="button" class="rounded-full border border-cyan-400/30 bg-cyan-400/10 px-3 py-1.5 text-xs text-cyan-100" @click="storyOpenInField()">在星域中点亮</button></div>
                  </div>

                  <section class="mt-7">
                    <div class="flex items-center justify-between"><h2 class="text-xs font-semibold text-slate-200">事件时间线</h2><span class="text-[10px] text-slate-600">按事件发生时间，不按入库时间</span></div>
                    <div class="relative mt-4 space-y-0 before:absolute before:bottom-4 before:left-[7px] before:top-4 before:w-px before:bg-gradient-to-b before:from-violet-400/50 before:to-cyan-400/20">
                      <template x-for="(canonicalId,index) in (storyDetail?.revisions?.[storyDetail.revisions.length-1]?.member_ids || [])" :key="canonicalId">
                        <button type="button" class="relative block w-full py-3 pl-8 text-left" @click="storyOpenCanonical(canonicalId,index)"><span class="absolute left-0 top-[18px] h-3.5 w-3.5 rounded-full border border-violet-300/60 bg-slate-950 shadow-[0_0_10px_rgba(167,139,250,.35)]"></span><span class="block font-mono text-[10px] text-slate-600" x-text="'节点 '+String(index+1).padStart(2,'0')"></span><span class="mt-1 block text-xs text-slate-300" x-text="canonicalId"></span></button>
                      </template>
                    </div>
                  </section>

                  <section class="mt-7 grid gap-3 md:grid-cols-2">
                    <template x-for="edge in (storyDetail?.revisions?.[storyDetail.revisions.length-1]?.edges || [])" :key="edge.edge_id">
                      <div class="rounded-xl border border-slate-800 bg-slate-950/45 p-4"><div class="flex items-center justify-between"><span class="rounded-full border border-violet-500/20 bg-violet-500/10 px-2 py-0.5 text-[10px] text-violet-200" x-text="edge.relation_type"></span><span class="font-mono text-[10px] text-slate-600" x-text="edge.evidence_revision_ids.length+' 份证据'"></span></div><div class="mt-3 break-all text-[10px] leading-5 text-slate-500" x-text="edge.source_canonical_id+' → '+edge.target_canonical_id"></div><div class="mt-3 flex flex-wrap gap-1"><template x-for="evidenceId in edge.evidence_revision_ids" :key="evidenceId"><button type="button" class="rounded border border-emerald-500/20 bg-emerald-500/5 px-2 py-1 font-mono text-[9px] text-emerald-300" @click="openEvidenceInField(evidenceId)" x-text="'证据 '+evidenceId.slice(0,8)"></button></template></div></div>
                    </template>
                  </section>

                  <section class="mt-8 border-t border-slate-800 pt-5"><div class="text-xs font-semibold text-slate-300">解释这条故事的简报</div><div class="mt-3 grid gap-2 md:grid-cols-2"><template x-for="reference in storyDetail?.brief_references || []" :key="reference.id"><button type="button" class="rounded-lg border border-cyan-500/15 bg-cyan-500/5 p-3 text-left" @click="openBriefAtReference(reference)"><span class="block text-xs text-slate-200" x-text="reference.label || reference.anchor"></span><span class="mt-1 block font-mono text-[10px] text-cyan-400" x-text="'简报段落 ['+reference.position+']'"></span></button></template><div class="text-xs text-slate-600" x-show="!(storyDetail?.brief_references || []).length">尚无简报引用这条故事。</div></div></section>
                  <section class="mt-8 border-t border-slate-800 pt-5">
                    <div class="flex items-center justify-between"><div class="text-xs font-semibold text-slate-300">版本历史</div><div class="text-[10px] text-slate-600">认知时间轴</div></div>
                    <div class="mt-3 space-y-2">
                      <template x-for="revision in storyDetail?.revisions || []" :key="revision.id">
                        <div class="flex flex-wrap items-center justify-between gap-2 rounded-lg border border-slate-800 bg-slate-950/35 px-3 py-2">
                          <div class="font-mono text-[10px] text-slate-500" x-text="String(revision.observed_at || '').slice(0,16).replace('T',' ')+' · '+revision.member_ids.length+' 节点'"></div>
                          <div class="text-[10px]" :class="revision.delta?.baseline ? 'text-violet-300' : 'text-cyan-300'" x-text="storyRevisionDeltaLabel(revision)"></div>
                        </div>
                      </template>
                    </div>
                  </section>
                </div>
                <div class="flex h-full items-center justify-center text-xs text-slate-600" x-show="!storyDetail && !storyDetailLoading">从左侧选择一条故事航迹</div>
              </main>
            </div>
          </div>
