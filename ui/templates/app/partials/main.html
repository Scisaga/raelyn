      <!-- Main -->
      <main class="min-w-0 flex-1">
        <header
          class="sticky top-0 z-10 h-14 border-b border-slate-800 bg-slate-950/70 backdrop-blur flex items-center justify-between px-4"
        >
          <div class="flex items-center gap-3 min-w-0">
            <button
              type="button"
              class="md:hidden shrink-0 inline-flex items-center justify-center h-9 w-9 rounded-md hover:bg-slate-800/60 text-slate-200"
              x-show="sidebarMobilePortrait"
              x-transition.opacity.duration.150ms
              @click="toggleSidebar()"
              :title="sidebarHidden ? '显示菜单' : '隐藏菜单'"
              :aria-label="sidebarHidden ? '显示菜单' : '隐藏菜单'"
            >
              <svg
                x-show="sidebarHidden"
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M4 6h16" />
                <path d="M4 12h16" />
                <path d="M4 18h16" />
              </svg>
              <svg
                x-show="!sidebarHidden"
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M15 18l-6-6 6-6" />
              </svg>
            </button>
            <div class="text-sm font-semibold truncate" x-text="pageTitle"></div>
            <div class="hidden md:flex items-center gap-2 text-xs text-slate-400 min-w-0">
              <div class="inline-flex items-center gap-2 rounded-full border border-slate-800 bg-slate-900/40 px-3 py-1">
                <span class="h-2 w-2 rounded-full" :class="healthOk ? 'bg-emerald-400' : 'bg-rose-400'"></span>
                <span x-text="healthOk ? 'Health OK' : 'Offline'"></span>
              </div>
              <div class="truncate max-w-[420px]" x-text="globalStatus"></div>
            </div>
          </div>

          <div class="flex items-center gap-2">
            <button
              class="inline-flex items-center gap-2 rounded-md bg-emerald-500 px-3 py-1.5 text-sm font-medium text-slate-950 hover:bg-emerald-400"
              @click="openAddMedia()"
            >
              <svg
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M12 5v14" />
                <path d="M5 12h14" />
              </svg>
              <span class="hidden sm:inline">添加媒体</span>
            </button>
            <button
              class="inline-flex items-center gap-2 rounded-md border border-slate-700 bg-slate-950/20 px-3 py-1.5 text-sm text-slate-200 hover:bg-slate-800/60"
              @click="refreshActive()"
            >
              <svg
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M21 12a9 9 0 0 1-15 6.36" />
                <path d="M3 12a9 9 0 0 1 15-6.36" />
                <path d="M6 18H3v-3" />
                <path d="M18 6h3v3" />
              </svg>
              <span class="hidden sm:inline">刷新</span>
            </button>
          </div>
        </header>

        <section class="p-4 sm:p-5 space-y-4">
