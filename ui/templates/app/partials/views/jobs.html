		          <!-- Jobs -->
		          <div x-show="activeView==='jobs'" x-transition.opacity>
		            <div class="rounded-xl border border-slate-800 bg-slate-900/40 overflow-hidden">
			              <div class="px-4 pt-3 pb-3 border-b border-slate-800 flex flex-col gap-3">
		                <div class="flex flex-wrap items-center justify-between gap-3">
		                  <div class="flex flex-wrap items-center gap-2">
		                    <div class="text-sm font-semibold mr-2">任务</div>
		                    <button
		                      class="px-3 py-1.5 rounded-md border text-sm"
		                      :class="jobsTab==='active' ? 'border-emerald-500/30 bg-emerald-500/10 text-emerald-200' : 'border-slate-700 bg-slate-950/20 text-slate-200 hover:bg-slate-800/60'"
		                      @click="setJobsTab('active')"
		                    >
		                      <span>待处理 / 运行中</span>
		                      <span
		                        class="ml-2 inline-flex items-center px-2 py-0.5 rounded-full border border-slate-700 bg-slate-950/30 text-[11px] text-slate-300"
		                        x-text="jobListActive.length"
		                      ></span>
		                    </button>
	                    <button
	                      class="px-3 py-1.5 rounded-md border text-sm"
	                      :class="jobsTab==='succeeded' ? 'border-emerald-500/30 bg-emerald-500/10 text-emerald-200' : 'border-slate-700 bg-slate-950/20 text-slate-200 hover:bg-slate-800/60'"
	                      @click="setJobsTab('succeeded')"
	                    >
	                      已成功
	                    </button>
	                    <button
	                      class="px-3 py-1.5 rounded-md border text-sm"
	                      :class="jobsTab==='failed' ? 'border-emerald-500/30 bg-emerald-500/10 text-emerald-200' : 'border-slate-700 bg-slate-950/20 text-slate-200 hover:bg-slate-800/60'"
	                      @click="setJobsTab('failed')"
	                    >
	                      失败 / 取消
		                    </button>
		                  </div>

		                  <div class="flex flex-wrap items-center gap-2 justify-end">
		                    <div class="text-xs text-slate-400 flex items-center gap-2" x-show="jobsTab==='active'">
		                      <span class="inline-flex items-center gap-2">
		                        <span class="w-2 h-2 rounded-full" :class="jobsWsConnected ? 'bg-emerald-400' : 'bg-slate-500'"></span>
		                        <span x-text="jobsWsConnected ? '实时已连接' : '连接中…'"></span>
		                      </span>
		                      <span x-show="jobsWsError" class="text-rose-300" x-text="jobsWsError"></span>
		                    </div>

		                    <div class="flex flex-wrap items-center gap-2" x-show="jobsTab!=='active'">
		                      <span class="text-xs text-slate-400">时间范围</span>
		                      <div class="relative">
		                        <input
		                          x-ref="jobsDoneFromInput"
		                          type="datetime-local"
		                          x-model="jobsDoneFrom"
		                          @change="applyJobsRange()"
		                          class="rounded-md border border-slate-700 bg-slate-950/30 px-3 py-2 pr-9 text-xs text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500/30"
		                        />
		                        <button
		                          type="button"
		                          class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200"
		                          @click="($refs.jobsDoneFromInput && $refs.jobsDoneFromInput.showPicker ? $refs.jobsDoneFromInput.showPicker() : $refs.jobsDoneFromInput && $refs.jobsDoneFromInput.focus())"
		                          title="选择时间"
		                        >
		                          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
		                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
		                            <path d="M16 2v4"></path>
		                            <path d="M8 2v4"></path>
		                            <path d="M3 10h18"></path>
		                          </svg>
		                        </button>
		                      </div>
		                      <span class="text-xs text-slate-500">到</span>
		                      <div class="relative">
		                        <input
		                          x-ref="jobsDoneToInput"
		                          type="datetime-local"
		                          x-model="jobsDoneTo"
		                          @change="applyJobsRange()"
		                          class="rounded-md border border-slate-700 bg-slate-950/30 px-3 py-2 pr-9 text-xs text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500/30"
		                        />
		                        <button
		                          type="button"
		                          class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200"
		                          @click="($refs.jobsDoneToInput && $refs.jobsDoneToInput.showPicker ? $refs.jobsDoneToInput.showPicker() : $refs.jobsDoneToInput && $refs.jobsDoneToInput.focus())"
		                          title="选择时间"
		                        >
		                          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
		                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
		                            <path d="M16 2v4"></path>
		                            <path d="M8 2v4"></path>
		                            <path d="M3 10h18"></path>
		                          </svg>
		                        </button>
		                      </div>
		                    </div>

		                    <div class="flex items-center gap-2">
		                      <input
		                        list="jobsTypeOptions"
		                        x-model="jobsTypeFilter"
	                        @change="applyJobsTypeFilter()"
	                        @keyup.enter="applyJobsTypeFilter()"
	                        placeholder="按任务类型筛选（可输入）"
	                        class="w-64 max-w-[60vw] rounded-md border border-slate-700 bg-slate-950/30 px-3 py-2 text-xs text-slate-100 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500/30"
	                      />
	                      <datalist id="jobsTypeOptions">
	                        <template x-for="t in jobsTypeOptions()" :key="t">
	                          <option :value="t"></option>
	                        </template>
	                      </datalist>
	                      <button
	                        class="px-3 py-2 rounded-md border border-slate-700 bg-slate-950/20 text-xs text-slate-200 hover:bg-slate-800/60"
	                        x-show="jobsTypeFilter"
	                        @click="clearJobsTypeFilter()"
	                      >
	                        清除
		                      </button>
		                    </div>
		                  </div>
		                </div>

			                <div x-show="jobsTab!=='active' && (jobsSeriesLoading || jobsSeriesError)" class="flex items-center justify-between gap-3">
			                  <div class="text-xs text-slate-400" x-show="jobsSeriesLoading">图表加载中…</div>
			                  <div class="text-xs text-rose-300" x-show="jobsSeriesError" x-text="jobsSeriesError"></div>
			                </div>

	                <div x-show="jobsTab!=='active'" class="rounded-lg border border-slate-800 bg-slate-950/25 p-3">
	                  <div class="flex items-center justify-between gap-3">
	                    <div class="text-xs text-slate-300 flex flex-wrap items-center gap-x-3 gap-y-2">
	                      <span>成功 / 失败 / 取消（按完成时间）</span>
	                      <span class="inline-flex items-center gap-1 text-[11px] text-slate-400">
	                        <span class="w-2 h-2 rounded-sm bg-emerald-500/70"></span>
	                        succeeded
	                      </span>
	                      <span class="inline-flex items-center gap-1 text-[11px] text-slate-400">
	                        <span class="w-2 h-2 rounded-sm bg-rose-500/70"></span>
	                        failed
	                      </span>
	                      <span class="inline-flex items-center gap-1 text-[11px] text-slate-400">
	                        <span class="w-2 h-2 rounded-sm bg-slate-500/60"></span>
	                        canceled
	                      </span>
	                    </div>
	                    <div class="text-[11px] text-slate-500" x-text="jobsSeriesDoneMax ? ('max: ' + jobsSeriesDoneMax) : ''"></div>
		                  </div>
		                  <div class="mt-2">
		                    <div x-ref="jobsDoneChart" class="h-32"></div>
		                    <div class="h-32 flex items-center justify-center text-xs text-slate-500" x-show="!(jobsSeriesDone||[]).length">
		                      暂无数据
		                    </div>
		                  </div>
		                </div>
		              </div>
	              <div x-show="jobsTab==='active'" class="divide-y divide-slate-800">
	                <template x-for="j in jobListActive" :key="j.id">
	                  <div class="p-4 flex items-center justify-between gap-4 hover:bg-slate-900/50">
	                    <div class="min-w-0 flex-1">
	                      <div class="flex items-start justify-between gap-3">
	                        <div class="min-w-0">
	                          <div class="font-medium truncate flex items-center gap-2">
	                            <span class="truncate" x-text="j.type"></span>
	                            <template x-if="jobMetaLabel(j)">
	                              <span
	                                class="inline-flex items-center px-2 py-0.5 rounded-full border border-slate-700 bg-slate-950/30 text-[11px] text-slate-300"
	                                x-text="jobMetaLabel(j)"
	                              ></span>
	                            </template>
	                          </div>
	                          <div class="mt-1 text-[11px] text-slate-500 flex flex-wrap gap-x-3 gap-y-1">
	                            <span>创建: <span class="text-slate-300" x-text="formatTsShort(j.created_at)"></span></span>
	                            <span>开始: <span class="text-slate-300" x-text="formatTsShort(j.started_at)"></span></span>
	                            <span>完成: <span class="text-slate-300" x-text="formatTsShort(j.finished_at)"></span></span>
	                            <span class="truncate">id: <span class="text-slate-400" x-text="j.id"></span></span>
	                          </div>
	                        </div>
	                        <div class="shrink-0 flex flex-col items-end gap-2">
	                          <span
	                            class="inline-flex items-center px-2.5 py-0.5 rounded-full border text-xs"
	                            :class="jobStatusPillClass(j.status)"
	                            x-text="jobStatusLabel(j)"
	                          ></span>
	                          <button
	                            class="px-3 py-1.5 rounded-md border border-slate-700 bg-slate-950/20 text-sm text-slate-200 hover:bg-slate-800/60"
	                            @click="cancelJob(j.id)"
	                          >
	                            取消
	                          </button>
	                        </div>
	                      </div>
	                    </div>
	                  </div>
	                </template>
	              </div>

	              <div x-show="jobsTab!=='active'" class="divide-y divide-slate-800">
	                <template x-for="j in jobListDone" :key="j.id">
	                  <div class="p-4 flex items-center justify-between gap-4 hover:bg-slate-900/50">
	                    <div class="min-w-0 flex-1">
	                      <div class="flex items-start justify-between gap-3">
	                        <div class="min-w-0">
	                          <div class="font-medium truncate flex items-center gap-2">
	                            <span class="truncate" x-text="j.type"></span>
	                            <template x-if="jobMetaLabel(j)">
	                              <span
	                                class="inline-flex items-center px-2 py-0.5 rounded-full border border-slate-700 bg-slate-950/30 text-[11px] text-slate-300"
	                                x-text="jobMetaLabel(j)"
	                              ></span>
	                            </template>
	                          </div>
	                          <div class="mt-1 text-[11px] text-slate-500 flex flex-wrap gap-x-3 gap-y-1">
	                            <span>创建: <span class="text-slate-300" x-text="formatTsShort(j.created_at)"></span></span>
	                            <span>开始: <span class="text-slate-300" x-text="formatTsShort(j.started_at)"></span></span>
	                            <span>完成: <span class="text-slate-300" x-text="formatTsShort(j.finished_at)"></span></span>
	                            <span class="truncate">id: <span class="text-slate-400" x-text="j.id"></span></span>
	                            <template x-if="j.error_message">
	                              <span class="text-rose-300 truncate" x-text="j.error_message"></span>
	                            </template>
	                          </div>
	                        </div>
	                        <div class="shrink-0 flex flex-col items-end gap-2">
	                          <span
	                            class="inline-flex items-center px-2.5 py-0.5 rounded-full border text-xs"
	                            :class="jobStatusPillClass(j.status)"
	                            x-text="jobStatusLabel(j)"
	                          ></span>
	                          <button
	                            class="px-3 py-1.5 rounded-md border border-slate-700 bg-slate-950/20 text-sm text-slate-200 hover:bg-slate-800/60"
	                            x-show="j.status!=='succeeded'"
	                            @click="retryJob(j.id)"
	                          >
	                            重试
	                          </button>
	                        </div>
	                      </div>
	                    </div>
	                  </div>
	                </template>
	              </div>
            </div>
          </div>
