              </div>
              <div class="rounded-lg border border-slate-800 bg-slate-900/40 p-4">

              <div class="rounded-lg border border-slate-800 bg-slate-900/40 p-4">

                  <span class="inline-flex items-center rounded-full border px-2 py-0.5 text-[11px]" :class="servicePillClass(services.db.ok)" x-text="serviceText(services.db)"></span>

                <div class="flex items-center justify-between gap-3">
                  <div class="text-xs text-slate-400">S3 / MinIO</div>
                  <span class="inline-flex items-center rounded-full border px-2 py-0.5 text-[11px]" :class="servicePillClass(services.s3.ok)" x-text="serviceText(services.s3)"></span>
                </div>
                <div class="mt-2 text-xs text-slate-400 truncate">
                  <span class="text-slate-300">bucket:</span>
                  <span x-text="services.s3.bucket || '-'"></span>

                <div class="mt-1 text-xs text-slate-400 truncate" x-show="services.s3.error" x-text="services.s3.error"></div>
              </div>

              <div class="rounded-lg border border-slate-800 bg-slate-900/40 p-4">
                <div class="flex items-center justify-between gap-3">
                  <div class="text-xs text-slate-400">ASR</div>
                  <span class="inline-flex items-center rounded-full border px-2 py-0.5 text-[11px]" :class="servicePillClass(services.asr.ok)" x-text="serviceText(services.asr)"></span>

                <div class="mt-2 text-xs text-slate-400 truncate" x-show="services.asr.url" x-text="services.asr.url"></div>

              </div>

              <div class="rounded-lg border border-slate-800 bg-slate-900/40 p-4">
                <div class="flex items-center justify-between gap-3">
                  <div class="text-xs text-slate-400">Ollama</div>
                  <span class="inline-flex items-center rounded-full border px-2 py-0.5 text-[11px]" :class="servicePillClass(services.ollama.ok)" x-text="serviceText(services.ollama)"></span>
                </div>
                <div class="mt-2 text-xs text-slate-400 truncate" x-show="services.ollama.url" x-text="services.ollama.url"></div>
                <div class="mt-1 text-xs text-slate-400 truncate" x-show="services.ollama.error && services.ollama.configured" x-text="services.ollama.error"></div>
              </div>
            </div>
