      <!-- Sidebar -->
      <aside
        class="relative flex flex-col border-r border-slate-800 bg-gradient-to-b from-slate-950 to-slate-900/60 backdrop-blur transition-[width] duration-200 ease-out"
        x-show="!sidebarHidden"
        x-transition.opacity.duration.150ms
        :class="sidebarCollapsed ? 'w-14' : 'w-48'"
      >
        <div
          class="h-14 flex items-center border-b border-slate-800"
          :class="sidebarCollapsed ? 'justify-center px-0' : 'justify-between px-3'"
        >
          <div class="flex items-center gap-2 min-w-0">
            <button
              type="button"
              class="shrink-0 rounded-md bg-emerald-500/10 ring-1 ring-emerald-500/15 flex items-center justify-center"
              :class="sidebarCollapsed ? 'h-7 w-7 hover:bg-emerald-500/15 cursor-pointer' : 'h-8 w-8 cursor-default'"
              :title="sidebarCollapsed ? (sidebarMobilePortrait ? '隐藏菜单' : '展开菜单') : ''"
              @click="sidebarCollapsed ? toggleSidebar() : null"
            >
              <img
                src="/static/brand/logo.svg"
                alt="video-sync"
                class="shrink-0"
                :class="sidebarCollapsed ? 'h-6 w-6' : 'h-8 w-8'"
              />
            </button>
            <div class="min-w-0" x-show="!sidebarCollapsed" x-transition.opacity.duration.150ms>
              <div class="text-sm font-semibold leading-5">video-sync</div>
              <div class="text-[11px] text-slate-400 truncate" x-text="globalStatus"></div>
            </div>
          </div>
          <button
            class="shrink-0 inline-flex items-center justify-center h-8 w-8 rounded-md hover:bg-slate-800/60 text-slate-300"
            x-show="!sidebarCollapsed"
            x-transition.opacity.duration.150ms
            @click="toggleSidebar()"
            :title="sidebarCollapsed ? '展开菜单' : '收起菜单'"
          >
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 6h16" />
              <path d="M4 12h16" />
              <path d="M4 18h16" />
            </svg>
          </button>
        </div>

        <nav class="flex-1 overflow-y-auto space-y-1 videosync-sidebar-nav">
          <template x-for="item in navItems.filter(i => !i.hidden)" :key="item.key">
            <button
              class="group flex items-center rounded-md text-sm leading-none transition border border-transparent"
              :class="[(sidebarCollapsed ? 'w-10 justify-center mx-2 my-1' : 'w-full gap-1 mx-2 my-1'), activeView===item.key ? 'bg-slate-800/70 text-slate-50 border-slate-700/60' : 'text-slate-300 hover:bg-slate-800/40 hover:text-slate-100']"
              @click="switchView(item.key)"
              :title="sidebarCollapsed ? item.label : ''"
            >
              <span class="shrink-0 w-10 h-10 flex items-center justify-center" x-html="item.icon"></span>
              <span class="truncate" x-show="!sidebarCollapsed" x-transition.opacity.duration.150ms x-text="item.label"></span>
            </button>
          </template>
        </nav>

        <div class="p-3 border-t border-slate-800">
          <div class="flex items-center gap-2">
            <span class="h-2 w-2 rounded-full" :class="healthOk ? 'bg-emerald-400' : 'bg-rose-400'"></span>
            <div
              class="text-xs text-slate-400 truncate"
              x-show="!sidebarCollapsed"
              x-transition.opacity.duration.150ms
              x-text="healthOk ? 'Health OK' : 'Offline'"
            ></div>
          </div>
        </div>
      </aside>
