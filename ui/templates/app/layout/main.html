      <!-- Main -->
      <main class="min-w-0 flex-1">
        <header
          class="sticky top-0 z-10 h-14 border-b border-slate-800 bg-slate-950/70 backdrop-blur flex items-center justify-between px-4"
        >
          <div class="flex items-center gap-3 min-w-0">
            <button
              type="button"
              class="md:hidden shrink-0 inline-flex items-center justify-center h-9 w-9 rounded-md hover:bg-slate-800/60 text-slate-200"
              x-show="sidebarMobilePortrait"
              x-transition.opacity.duration.150ms
              @click="toggleSidebar()"
              :title="sidebarHidden ? '显示菜单' : '隐藏菜单'"
              :aria-label="sidebarHidden ? '显示菜单' : '隐藏菜单'"
            >
              <svg
                x-show="sidebarHidden"
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M4 6h16" />
                <path d="M4 12h16" />
                <path d="M4 18h16" />
              </svg>
              <svg
                x-show="!sidebarHidden"
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M15 18l-6-6 6-6" />
              </svg>
            </button>
            <button
              type="button"
              class="inline-flex items-center gap-1.5 rounded-md px-1.5 py-1 text-sm font-medium text-slate-400 transition-colors hover:bg-slate-800/40 hover:text-slate-200"
              x-show="activeView === 'playlists'"
              @click="switchView('playlists')"
              title="返回播放列表"
              aria-label="返回播放列表"
            >
              <span aria-hidden="true">←</span>
              <span>播放列表</span>
            </button>
            <div
              class="text-md font-semibold truncate"
              x-show="activeView !== 'playlists'"
              x-text="pageTitle"
            ></div>
            <div class="hidden md:flex items-center gap-2 text-xs text-slate-400 min-w-0" x-show="globalStatus" x-transition.opacity.duration.150ms>
              <div class="truncate max-w-[520px]" x-text="globalStatus"></div>
            </div>
          </div>

          <div class="flex items-center gap-2">
            <button
              class="inline-flex items-center gap-2 rounded-md border border-red-900/60 bg-red-950/20 px-3 py-1.5 text-sm text-red-200 hover:bg-red-900/30"
              x-show="hasProviderPause('youtube')"
              x-transition.opacity.duration.150ms
              :title="providerPauseMessage('youtube')"
              @click="gotoCookiesSettings('youtube')"
            >
              <span class="hidden sm:inline" x-text="providerPauseLabel('youtube')"></span>
              <span class="text-xs truncate max-w-[240px] hidden md:inline" x-text="providerPauseHint('youtube')"></span>
            </button>
            <button
              class="inline-flex items-center gap-2 rounded-md border border-sky-900/60 bg-sky-950/20 px-3 py-1.5 text-sm text-sky-200 hover:bg-sky-900/30"
              x-show="hasProviderPause('bilibili')"
              x-transition.opacity.duration.150ms
              :title="providerPauseMessage('bilibili')"
              @click="gotoCookiesSettings('bilibili')"
            >
              <span class="hidden sm:inline" x-text="providerPauseLabel('bilibili')"></span>
              <span class="text-xs truncate max-w-[220px] hidden md:inline" x-text="providerPauseHint('bilibili')"></span>
            </button>
            <button
              class="inline-flex items-center gap-2 rounded-md border border-rose-900/60 bg-rose-950/20 px-3 py-1.5 text-sm text-rose-200 hover:bg-rose-900/30"
              x-show="pause && pause.paused"
              x-transition.opacity.duration.150ms
              :title="pause && pause.message ? pause.message : '系统已暂停'"
              @click="gotoCookiesSettings()"
            >
              <span class="hidden sm:inline">已暂停</span>
              <span class="text-xs truncate max-w-[360px] hidden md:inline" x-text="pauseBadgeText()"></span>
            </button>
            <div class="relative hidden sm:block" @click.away="semanticSearchOpen=false">
              <input
                class="h-8 w-52 rounded-full border border-slate-800 bg-slate-950/45 px-3 pr-8 text-xs text-slate-200 outline-none placeholder:text-slate-600 focus:w-72 focus:border-cyan-500/35"
                placeholder="搜索星域、故事与证据"
                x-model="semanticSearchQuery"
                @input.debounce.300ms="runSemanticSearch()"
                @focus="if(semanticSearchQuery) semanticSearchOpen=true"
                @keydown.escape="semanticSearchOpen=false"
              />
              <svg class="pointer-events-none absolute right-2.5 top-2 text-slate-600" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
              <div class="absolute right-0 top-10 z-50 max-h-[70vh] w-[28rem] overflow-auto rounded-xl border border-slate-800 bg-slate-950/98 p-2 shadow-2xl raelyn-scrollbar" x-show="semanticSearchOpen" x-transition.opacity>
                <div class="px-2 py-2 text-xs text-slate-500" x-show="semanticSearchLoading">正在检索语义对象…</div>
                <template x-for="group in semanticSearchGroupList()" :key="group.key">
                  <div class="mb-2">
                    <div class="px-2 py-1 text-[10px] uppercase tracking-[0.14em] text-slate-600" x-text="group.label"></div>
                    <template x-for="item in group.items" :key="group.key+':'+item.id">
                      <button type="button" class="block w-full rounded-lg px-2.5 py-2 text-left hover:bg-slate-900" @click="openSemanticSearchResult(item)">
                        <span class="block truncate text-xs text-slate-200" x-text="item.title || item.id"></span>
                        <span class="mt-0.5 block truncate text-[10px] text-slate-600" x-text="item.summary || item.provider || item.domain_id || ''"></span>
                      </button>
                    </template>
                  </div>
                </template>
                <div class="px-2 py-3 text-xs text-slate-600" x-show="!semanticSearchLoading && semanticSearchQuery && !semanticSearchGroupList().length">没有找到匹配的语义对象</div>
              </div>
            </div>
            <button type="button" class="inline-flex h-8 items-center gap-2 rounded-full border border-slate-800 bg-slate-950/35 px-2.5 text-[11px] text-slate-400 hover:border-slate-700" @click="openOperations({type:'health'})" title="系统健康与运行中心">
              <span class="h-2 w-2 rounded-full" :class="healthOk ? 'bg-emerald-400' : 'bg-rose-400'"></span>
              <span class="hidden lg:inline" x-text="healthOk ? '观测站正常' : '存在异常'"></span>
            </button>
          </div>
        </header>

        <section
          class="min-h-0"
          :class="['overview','field','domains','stories','briefs','library','operations','settings','playlist','playlists','videos','video','media','jobs','mcp-guide'].includes(activeView) ? 'relative p-0 sm:p-0 space-y-0 overflow-hidden' : 'p-4 sm:p-5 space-y-4'"
          :style="['overview','field','domains','stories','briefs','library','operations','settings','playlist','playlists','videos','video','media','jobs','mcp-guide'].includes(activeView) ? 'height: calc(100vh - 3.5rem);' : ''"
        >
<!-- @include ../views/overview.html -->

<!-- @include ../views/media.html -->

<!-- @include ../views/videos.html -->

<!-- @include ../views/video.html -->

<!-- @include ../views/jobs.html -->

<!-- @include ../views/playlists.html -->

<!-- @include ../views/field-v2.html -->

<!-- @include ../views/playback-v2.html -->

<!-- @include ../views/domains-v2.html -->

<!-- @include ../views/stories.html -->

<!-- @include ../views/briefs-v2.html -->

<!-- @include ../views/library-toolbar.html -->

<!-- @include ../views/v2-modals.html -->

<!-- @include ../views/settings.html -->

<!-- @include ../views/mcp-guide.html -->
        </section>

        <div
          class="fixed inset-x-3 bottom-3 z-30 md:hidden"
          x-show="pwaShouldShowHint()"
          x-transition.opacity.duration.150ms
          x-cloak
        >
          <div class="rounded-2xl border border-emerald-500/20 bg-slate-950/95 shadow-[0_14px_34px_rgba(0,0,0,0.45)] backdrop-blur">
            <div class="flex items-start gap-3 px-4 py-3">
              <div class="mt-0.5 h-2.5 w-2.5 shrink-0 rounded-full bg-emerald-400"></div>
              <div class="min-w-0 flex-1">
                <div class="text-sm font-semibold text-slate-100" x-text="pwaCardTitle()"></div>
                <div class="mt-1 text-xs leading-5 text-slate-300" x-text="pwaHintText()"></div>
              </div>
              <button
                type="button"
                class="shrink-0 rounded-md px-2 py-1 text-slate-400 hover:bg-slate-800/70 hover:text-slate-100"
                @click="dismissPwaHint()"
                title="关闭提示"
                aria-label="关闭提示"
              >
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M18 6 6 18"></path>
                  <path d="M6 6l12 12"></path>
                </svg>
              </button>
            </div>
            <div class="flex items-center justify-end gap-2 border-t border-slate-800 px-4 py-3">
              <button
                type="button"
                class="rounded-md border border-slate-700 bg-slate-950/30 px-3 py-1.5 text-xs text-slate-300 hover:bg-slate-800/60"
                @click="dismissPwaHint()"
              >
                稍后
              </button>
              <button
                type="button"
                class="rounded-md border border-emerald-500/30 bg-emerald-500/10 px-3 py-1.5 text-xs font-semibold text-emerald-200 hover:bg-emerald-500/20"
                @click="openPwaInstall()"
              >
                <span x-text="pwaActionLabel()"></span>
              </button>
            </div>
          </div>
        </div>

        <div
          class="fixed inset-0 z-40 flex items-center justify-center bg-slate-950/75 px-4"
          x-show="pwaGuideOpen"
          x-transition.opacity.duration.150ms
          x-cloak
        >
          <div class="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-950 shadow-[0_24px_80px_rgba(0,0,0,0.55)]">
            <div class="flex items-start justify-between gap-3 border-b border-slate-800 px-5 py-4">
              <div>
                <div class="text-sm font-semibold text-slate-100" x-text="pwaCardTitle()"></div>
                <div class="mt-1 text-xs text-slate-400">
                  <span x-show="pwaGuideMode==='native'">请使用浏览器地址栏或菜单中的原生安装入口。</span>
                  <span x-show="pwaGuideMode==='ios'">使用 Safari 的系统能力完成添加。</span>
                  <span x-show="pwaGuideMode==='ios-browser'">当前浏览器不支持 iOS 主屏幕添加。</span>
                </div>
              </div>
              <button
                type="button"
                class="rounded-md p-1.5 text-slate-400 hover:bg-slate-800/60 hover:text-slate-100"
                @click="closePwaGuide()"
                title="关闭"
                aria-label="关闭"
              >
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M18 6 6 18"></path>
                  <path d="M6 6l12 12"></path>
                </svg>
              </button>
            </div>
            <div class="space-y-3 px-5 py-4 text-sm leading-6 text-slate-300">
              <div x-show="pwaGuideMode==='native'">
                <div>1. 点击地址栏中的安装图标，或打开浏览器菜单。</div>
                <div>2. 选择“安装应用”或“添加到主屏幕”。</div>
                <div>3. 按浏览器提示完成安装或添加。</div>
              </div>
              <div x-show="pwaGuideMode==='ios'">
                <div>1. 使用 Safari 打开当前页面。</div>
                <div>2. 点击底部或顶部的“分享”按钮。</div>
                <div>3. 选择“添加到主屏幕”。</div>
                <div>4. 确认名称后点击“添加”。</div>
              </div>
              <div x-show="pwaGuideMode==='ios-browser'">
                <div>iPhone / iPad 只有 Safari 支持“添加到主屏幕”。</div>
                <div>请复制当前链接，用 Safari 打开后再执行“分享 -> 添加到主屏幕”。</div>
              </div>
            </div>
            <div class="flex justify-end border-t border-slate-800 px-5 py-4">
              <button
                type="button"
                class="rounded-md border border-slate-700 bg-slate-950/30 px-3 py-1.5 text-sm text-slate-200 hover:bg-slate-800/60"
                @click="closePwaGuide()"
              >
                关闭
              </button>
            </div>
          </div>
        </div>
      </main>
