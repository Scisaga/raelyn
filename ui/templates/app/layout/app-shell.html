    <div x-data="appShell()" x-init="init()" x-cloak class="relative min-h-screen bg-slate-950" :class="startupGateVisible ? 'overflow-hidden' : ''">
      <div class="raelyn-startup-shell min-h-screen flex" :class="startupGateVisible ? 'opacity-0 pointer-events-none select-none' : 'opacity-100'" :aria-hidden="startupGateVisible ? 'true' : 'false'">
<!-- @include ../components/sidebar.html -->

<!-- @include main.html -->

<!-- @include ../components/toasts.html -->

<!-- @include ../components/modals/add-media.html -->

<!-- @include ../components/modals/import-media.html -->

<!-- @include ../components/modals/create-playlist.html -->
      </div>

      <div
        class="fixed inset-0 z-50 overflow-hidden raelyn-startup-screen"
        x-show="startupGateVisible"
        x-transition.opacity.duration.300ms
        :class="startupFluidActive ? 'raelyn-startup-screen-fluid' : ''"
        :role="apiAuthPromptVisible ? 'dialog' : 'status'"
        aria-live="polite"
        :aria-label="startupGateAriaLabel()"
      >
        <canvas x-ref="startupFluidCanvas" class="absolute inset-0 h-full w-full raelyn-startup-canvas" aria-hidden="true"></canvas>
        <div class="absolute inset-0 raelyn-startup-overlay" aria-hidden="true"></div>

        <div class="pointer-events-none relative z-[1] flex min-h-screen items-center justify-center px-6 py-8">
          <div class="raelyn-startup-stage w-full max-w-md">
            <div class="raelyn-startup-panel">
              <div class="raelyn-startup-logo">
                <img src="/static/brand/logo.png" alt="" class="raelyn-startup-logo-image" loading="eager" decoding="async" />
              </div>

              <div class="mt-7 text-center">
                <div class="text-[11px] font-semibold uppercase tracking-[0.48em] text-slate-500">RAELYN</div>
                <div class="mt-4 text-lg font-medium tracking-[0.01em] text-slate-100" x-text="startupGateMessage()"></div>
              </div>

              <div class="raelyn-startup-dots mt-5" x-show="!apiAuthPromptVisible" x-transition.opacity.duration.200ms aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
              </div>

              <div class="pointer-events-auto mt-6 w-full max-w-sm mx-auto" x-show="apiAuthPromptVisible" x-transition.opacity.duration.200ms>
                <div class="flex items-stretch gap-2">
                  <input
                    x-ref="startupTokenInput"
                    type="password"
                    class="raelyn-startup-token-input min-w-0 flex-1 rounded-md border border-slate-700/80 bg-slate-950/60 px-4 py-3 text-sm text-slate-100 placeholder-slate-500 shadow-[inset_0_1px_0_rgba(255,255,255,0.04)] focus:outline-none focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500/40"
                    placeholder="输入访问 token"
                    autocomplete="off"
                    autocapitalize="off"
                    autocorrect="off"
                    spellcheck="false"
                    x-model="apiAuthTokenDraft"
                    :disabled="apiAuthSubmitting"
                    @keydown.enter.prevent="submitStartupToken()"
                  />
                  <button
                    type="button"
                    class="inline-flex shrink-0 items-center justify-center rounded-md border border-emerald-500/25 bg-emerald-500/10 px-3 text-emerald-200 transition hover:bg-emerald-500/16 focus:outline-none focus:ring-2 focus:ring-emerald-500/30 disabled:cursor-not-allowed disabled:opacity-50"
                    :disabled="apiAuthSubmitting"
                    aria-label="确认访问令牌"
                    title="确认"
                    @click="submitStartupToken()"
                  >
                    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                      <path d="M18 7v6H7"></path>
                      <path d="m10 10-3 3 3 3"></path>
                    </svg>
                  </button>
                </div>
                <div
                  class="mt-3 text-center text-xs leading-5"
                  :class="apiAuthError ? 'text-rose-300' : 'text-slate-400'"
                  x-text="startupGateAuthMessage()"
                ></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
