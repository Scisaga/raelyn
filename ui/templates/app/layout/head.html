  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAELYN🪅</title>
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="RAELYN" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <link rel="icon" href="/static/brand/logo.png" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/css/tailwind.min.css" />
    <style>
      [x-cloak] {
        display: none !important;
      }
      /* Make native selects/options match dark UI better (browser support varies). */
      select {
        color-scheme: dark;
      }
      select option {
        background: rgb(2 6 23); /* slate-950 */
        color: rgb(226 232 240); /* slate-200 */
      }

      input[type="datetime-local"] {
        color-scheme: dark;
      }
      input[type="datetime-local"]::-webkit-calendar-picker-indicator {
        display: none;
      }

      .video-card {
        will-change: transform;
        transition:
          transform 160ms ease,
          box-shadow 160ms ease,
          border-color 160ms ease,
          background-color 160ms ease;
      }

      .video-card:hover {
        transform: translateY(-3px) scale(1.02);
        border-color: rgba(16, 185, 129, 0.6); /* emerald-500 */
        box-shadow:
          0 0 0 1px rgba(16, 185, 129, 0.22),
          0 0 0 4px rgba(16, 185, 129, 0.08),
          0 18px 55px rgba(0, 0, 0, 0.55),
          0 0 34px rgba(16, 185, 129, 0.28);
        background-color: rgba(15, 23, 42, 0.7); /* slate-900 */
      }

      .raelyn-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: rgba(148, 163, 184, 0.4) rgba(2, 6, 23, 0.35);
      }

      .raelyn-scrollbar::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      .raelyn-scrollbar::-webkit-scrollbar-track {
        background: rgba(2, 6, 23, 0.35);
        border-left: 1px solid rgba(30, 41, 59, 0.55);
      }

      .raelyn-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.28);
        border: 2px solid rgba(2, 6, 23, 0.35);
        border-radius: 999px;
      }

      .raelyn-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(148, 163, 184, 0.4);
      }

      .raelyn-multiline-input {
        background-color: rgba(15, 23, 42, 0.78);
        border-color: rgba(51, 65, 85, 0.9);
        color: rgb(157, 176, 195);
        caret-color: rgb(241 245 249);
        transition:
          background-color 160ms ease,
          border-color 160ms ease,
          box-shadow 160ms ease;
      }

      .raelyn-multiline-input::placeholder {
        color: rgba(148, 163, 184, 0.78);
      }

      .raelyn-multiline-input:focus {
        border-color: rgba(16, 185, 129, 0.3);
        box-shadow:
          0 0 0 1px rgba(16, 185, 129, 0.18),
          0 0 0 4px rgba(16, 185, 129, 0.12);
      }

      /* Sidebar: keep scrollable but hide native scrollbar so collapsed icons don't look "broken". */
      .raelyn-sidebar-nav {
        scrollbar-width: none; /* Firefox */
      }
      .raelyn-sidebar-nav::-webkit-scrollbar {
        width: 0;
        height: 0;
      }

      /* Center-clear, edge-darkening overlay for image cards (radial vignette). */
      .raelyn-vignette {
        background:
          radial-gradient(
            ellipse at center,
            rgba(2, 6, 23, 0) 0%,
            rgba(2, 6, 23, 0.08) 42%,
            rgba(2, 6, 23, 0.45) 70%,
            rgba(2, 6, 23, 0.9) 100%
          ),
          radial-gradient(
            ellipse at 50% 110%,
            rgba(2, 6, 23, 0) 0%,
            rgba(2, 6, 23, 0.35) 55%,
            rgba(2, 6, 23, 0.85) 100%
          );
      }

      .raelyn-startup-shell {
        transition: opacity 280ms ease;
      }

      .raelyn-startup-screen {
        background:
          radial-gradient(circle at top, rgba(16, 185, 129, 0.14), transparent 34%),
          radial-gradient(circle at 82% 18%, rgba(34, 211, 238, 0.16), transparent 26%),
          linear-gradient(155deg, rgba(2, 6, 23, 1) 18%, rgba(15, 23, 42, 0.96) 58%, rgba(2, 6, 23, 1) 100%);
      }

      .raelyn-startup-mesh {
        inset: -16%;
        background-image:
          linear-gradient(rgba(148, 163, 184, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148, 163, 184, 0.08) 1px, transparent 1px);
        background-size: 72px 72px;
        mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 0.78) 0%, rgba(0, 0, 0, 0.18) 54%, transparent 82%);
        transform: perspective(1000px) rotateX(77deg) translateY(18%);
        transform-origin: center;
        animation: raelyn-startup-grid 18s linear infinite;
        opacity: 0.38;
      }

      .raelyn-startup-glow {
        border-radius: 9999px;
        filter: blur(64px);
        opacity: 0.72;
        animation: raelyn-startup-float 9s ease-in-out infinite;
      }

      .raelyn-startup-glow-a {
        top: 14%;
        left: 14%;
        width: 18rem;
        height: 18rem;
        background: rgba(16, 185, 129, 0.24);
      }

      .raelyn-startup-glow-b {
        right: 12%;
        bottom: 18%;
        width: 22rem;
        height: 22rem;
        background: rgba(34, 211, 238, 0.18);
        animation-delay: -3s;
      }

      .raelyn-startup-glow-c {
        left: 50%;
        top: 50%;
        width: 14rem;
        height: 14rem;
        background: rgba(94, 234, 212, 0.14);
        transform: translate(-50%, -50%);
        animation-delay: -6s;
      }

      .raelyn-startup-ring {
        position: absolute;
        inset: 0;
        border-radius: 9999px;
      }

      .raelyn-startup-ring-outer {
        border: 1px solid rgba(148, 163, 184, 0.18);
        box-shadow:
          0 0 0 1px rgba(16, 185, 129, 0.08),
          inset 0 0 28px rgba(15, 23, 42, 0.45);
        animation: raelyn-startup-spin 8s linear infinite;
      }

      .raelyn-startup-ring-middle {
        inset: 18px;
        border: 1px solid rgba(103, 232, 249, 0.28);
        box-shadow: 0 0 24px rgba(34, 211, 238, 0.12);
        animation: raelyn-startup-spin-reverse 6.5s linear infinite;
      }

      .raelyn-startup-ring-inner {
        inset: 36px;
        border: 1px solid rgba(52, 211, 153, 0.34);
        box-shadow:
          0 0 22px rgba(16, 185, 129, 0.12),
          inset 0 0 18px rgba(16, 185, 129, 0.1);
        animation: raelyn-startup-pulse 2.8s ease-in-out infinite;
      }

      .raelyn-startup-core {
        position: absolute;
        inset: 56px;
        border-radius: 9999px;
        background:
          radial-gradient(circle at 32% 28%, rgba(103, 232, 249, 0.22), rgba(16, 185, 129, 0.1) 18%, rgba(15, 23, 42, 0.96) 44%, rgba(2, 6, 23, 0.98) 100%);
        box-shadow:
          0 0 18px rgba(45, 212, 191, 0.18),
          inset 0 0 28px rgba(2, 6, 23, 0.52),
          inset 0 0 10px rgba(255, 255, 255, 0.05);
        animation: raelyn-startup-core 2.6s ease-in-out infinite;
      }

      .raelyn-startup-logo {
        position: absolute;
        left: 50%;
        top: 50%;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 88px;
        height: 88px;
        border-radius: 9999px;
        background:
          radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.04) 36%, rgba(15, 23, 42, 0.14) 100%),
          linear-gradient(180deg, rgba(15, 23, 42, 0.4), rgba(2, 6, 23, 0.16));
        box-shadow:
          0 0 0 1px rgba(226, 232, 240, 0.08),
          0 12px 34px rgba(2, 6, 23, 0.42),
          inset 0 0 24px rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(8px);
        transform: translate(-50%, -50%);
        animation: raelyn-startup-logo 2.6s ease-in-out infinite;
      }

      .raelyn-startup-logo-image {
        width: 50px;
        height: 50px;
        object-fit: contain;
        filter:
          drop-shadow(0 0 12px rgba(34, 211, 238, 0.2))
          drop-shadow(0 0 20px rgba(16, 185, 129, 0.12));
      }

      .raelyn-startup-bars {
        position: absolute;
        left: 50%;
        bottom: 18px;
        display: flex;
        align-items: flex-end;
        gap: 8px;
        height: 42px;
        transform: translateX(-50%);
      }

      .raelyn-startup-bars span {
        width: 6px;
        border-radius: 9999px;
        background: linear-gradient(180deg, rgba(125, 211, 252, 0.95), rgba(16, 185, 129, 0.22));
        box-shadow: 0 0 18px rgba(34, 211, 238, 0.18);
        animation: raelyn-startup-bar 1.2s ease-in-out infinite;
      }

      .raelyn-startup-bars span:nth-child(1) {
        height: 16px;
        animation-delay: -0.45s;
      }

      .raelyn-startup-bars span:nth-child(2) {
        height: 26px;
        animation-delay: -0.2s;
      }

      .raelyn-startup-bars span:nth-child(3) {
        height: 34px;
      }

      .raelyn-startup-bars span:nth-child(4) {
        height: 24px;
        animation-delay: -0.3s;
      }

      .raelyn-startup-bars span:nth-child(5) {
        height: 14px;
        animation-delay: -0.55s;
      }

      @keyframes raelyn-startup-grid {
        from {
          transform: perspective(1000px) rotateX(77deg) translateY(18%);
        }
        to {
          transform: perspective(1000px) rotateX(77deg) translateY(12%);
        }
      }

      @keyframes raelyn-startup-float {
        0%,
        100% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        50% {
          transform: translate3d(0, -12px, 0) scale(1.06);
        }
      }

      @keyframes raelyn-startup-spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes raelyn-startup-spin-reverse {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(-360deg);
        }
      }

      @keyframes raelyn-startup-pulse {
        0%,
        100% {
          transform: scale(0.98);
          opacity: 0.7;
        }
        50% {
          transform: scale(1.02);
          opacity: 1;
        }
      }

      @keyframes raelyn-startup-core {
        0%,
        100% {
          transform: scale(0.94);
        }
        50% {
          transform: scale(1.02);
        }
      }

      @keyframes raelyn-startup-logo {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(0.98);
        }
        50% {
          transform: translate(-50%, -50%) scale(1.03);
        }
      }

      @keyframes raelyn-startup-bar {
        0%,
        100% {
          transform: scaleY(0.72);
          opacity: 0.58;
        }
        50% {
          transform: scaleY(1.08);
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .video-card {
          transition: none;
        }
        .video-card:hover {
          transform: none;
        }
        .raelyn-startup-shell {
          transition: none;
        }
        .raelyn-startup-mesh,
        .raelyn-startup-glow,
        .raelyn-startup-ring-outer,
        .raelyn-startup-ring-middle,
        .raelyn-startup-ring-inner,
        .raelyn-startup-core,
        .raelyn-startup-logo,
        .raelyn-startup-bars span {
          animation: none !important;
        }
      }

      .raelyn-brief h2 {
        display: inline-block;
        width: fit-content;
        max-width: 100%;
        padding: 0.1rem 0.5rem;
        border-radius: 0.2rem;
        background: rgba(148, 163, 184, 0.14);
        color: oklch(0.704 0.14 182.503);
      }
    </style>
    <script defer src="/static/vendor/lightweight-charts.min.js"></script>
    <script defer src="/static/app.js"></script>
    <script defer src="/static/vendor/alpine.min.js"></script>
  </head>
