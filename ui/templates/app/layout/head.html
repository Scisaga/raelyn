  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAELYN · 事件语义星域</title>
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="RAELYN" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest?v=20260727.2" />
    <link rel="apple-touch-icon" href="/static/pwa/apple-touch-icon.png?v=20260727.2" />
    <link rel="icon" href="/static/brand/raelyn-favicon.svg?v=__RAELYN_ASSET_VERSION__" sizes="any" type="image/svg+xml" />
    <link rel="icon" href="/static/brand/favicon-32.png?v=__RAELYN_ASSET_VERSION__" sizes="32x32" type="image/png" />
    <link rel="stylesheet" href="/static/css/tailwind.min.css?v=__RAELYN_ASSET_VERSION__" />
    <style>
      [x-cloak] {
        display: none !important;
      }
      /* Make native selects/options match dark UI better (browser support varies). */
      select {
        color-scheme: dark;
      }
      select option {
        background: rgb(2 6 23); /* slate-950 */
        color: rgb(226 232 240); /* slate-200 */
      }

      input[type="datetime-local"] {
        color-scheme: dark;
      }
      input[type="datetime-local"]::-webkit-calendar-picker-indicator {
        display: none;
      }

      .raelyn-startup-token-input {
        color-scheme: dark;
        background-color: rgba(2, 6, 23, 0.6);
        color: rgb(241 245 249);
      }

      .raelyn-startup-token-input:-webkit-autofill,
      .raelyn-startup-token-input:-webkit-autofill:hover,
      .raelyn-startup-token-input:-webkit-autofill:focus,
      .raelyn-startup-token-input:-webkit-autofill:active {
        -webkit-text-fill-color: rgb(241 245 249);
        box-shadow:
          inset 0 0 0 1000px rgba(2, 6, 23, 0.92),
          inset 0 1px 0 rgba(255, 255, 255, 0.04);
        transition: background-color 9999s ease-out 0s;
        caret-color: rgb(241 245 249);
      }

      .video-card {
        will-change: transform;
        transition:
          transform 160ms ease,
          box-shadow 160ms ease,
          border-color 160ms ease,
          background-color 160ms ease;
      }

      .video-card:hover {
        transform: translateY(-3px) scale(1.02);
        border-color: rgba(16, 185, 129, 0.6); /* emerald-500 */
        box-shadow:
          0 0 0 1px rgba(16, 185, 129, 0.22),
          0 0 0 4px rgba(16, 185, 129, 0.08),
          0 18px 55px rgba(0, 0, 0, 0.55),
          0 0 34px rgba(16, 185, 129, 0.28);
        background-color: rgba(15, 23, 42, 0.7); /* slate-900 */
      }

      .raelyn-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: rgba(148, 163, 184, 0.4) rgba(2, 6, 23, 0.35);
      }

      .raelyn-scrollbar::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      .raelyn-scrollbar::-webkit-scrollbar-track {
        background: rgba(2, 6, 23, 0.35);
        border-left: 1px solid rgba(30, 41, 59, 0.55);
      }

      .raelyn-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.28);
        border: 2px solid rgba(2, 6, 23, 0.35);
        border-radius: 999px;
      }

      .raelyn-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(148, 163, 184, 0.4);
      }

      .raelyn-multiline-input {
        background-color: rgba(15, 23, 42, 0.78);
        border-color: rgba(51, 65, 85, 0.9);
        color: rgb(157, 176, 195);
        caret-color: rgb(241 245 249);
        transition:
          background-color 160ms ease,
          border-color 160ms ease,
          box-shadow 160ms ease;
      }

      .raelyn-multiline-input::placeholder {
        color: rgba(148, 163, 184, 0.78);
      }

      .raelyn-multiline-input:focus {
        border-color: rgba(16, 185, 129, 0.3);
        box-shadow:
          0 0 0 1px rgba(16, 185, 129, 0.18),
          0 0 0 4px rgba(16, 185, 129, 0.12);
      }

      /* Sidebar: keep scrollable but hide native scrollbar so collapsed icons don't look "broken". */
      .raelyn-sidebar-nav {
        scrollbar-width: none; /* Firefox */
      }
      .raelyn-sidebar-nav::-webkit-scrollbar {
        width: 0;
        height: 0;
      }

      /* Center-clear, edge-darkening overlay for image cards (radial vignette). */
      .raelyn-vignette {
        background:
          radial-gradient(
            ellipse at center,
            rgba(2, 6, 23, 0) 0%,
            rgba(2, 6, 23, 0.08) 42%,
            rgba(2, 6, 23, 0.45) 70%,
            rgba(2, 6, 23, 0.9) 100%
          ),
          radial-gradient(
            ellipse at 50% 110%,
            rgba(2, 6, 23, 0) 0%,
            rgba(2, 6, 23, 0.35) 55%,
            rgba(2, 6, 23, 0.85) 100%
          );
      }

      .raelyn-startup-shell {
        transition: opacity 280ms ease;
      }

      .raelyn-startup-screen {
        isolation: isolate;
        background:
          radial-gradient(circle at 50% -10%, rgba(14, 165, 233, 0.22), transparent 30%),
          radial-gradient(circle at 20% 22%, rgba(16, 185, 129, 0.14), transparent 24%),
          radial-gradient(circle at 82% 78%, rgba(59, 130, 246, 0.16), transparent 28%),
          linear-gradient(180deg, rgba(2, 6, 23, 1) 0%, rgba(2, 6, 23, 0.98) 38%, rgba(1, 3, 12, 1) 100%);
      }

      .raelyn-startup-screen::before,
      .raelyn-startup-screen::after,
      .raelyn-startup-overlay {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .raelyn-startup-screen::before {
        z-index: 0;
        background:
          radial-gradient(circle at center, rgba(2, 6, 23, 0) 0%, rgba(2, 6, 23, 0.24) 56%, rgba(2, 6, 23, 0.72) 100%),
          linear-gradient(180deg, rgba(2, 6, 23, 0.08), rgba(2, 6, 23, 0.32));
      }

      .raelyn-startup-screen::after {
        z-index: 0;
        opacity: 0.72;
        background:
          conic-gradient(from 120deg at 50% 48%, transparent 0deg, rgba(56, 189, 248, 0.1) 70deg, transparent 142deg, rgba(16, 185, 129, 0.08) 220deg, transparent 310deg),
          linear-gradient(115deg, transparent 18%, rgba(125, 211, 252, 0.08) 38%, transparent 58%);
        mix-blend-mode: screen;
        animation: raelyn-startup-ambient 10s ease-in-out infinite alternate;
      }

      .raelyn-startup-overlay {
        z-index: 1;
        background:
          linear-gradient(180deg, rgba(2, 6, 23, 0.18), rgba(2, 6, 23, 0.52)),
          radial-gradient(circle at center, rgba(2, 6, 23, 0) 0%, rgba(2, 6, 23, 0.24) 68%, rgba(2, 6, 23, 0.74) 100%);
      }

      .raelyn-startup-screen-starfield .raelyn-startup-overlay {
        background:
          linear-gradient(180deg, rgba(2, 6, 23, 0.12), rgba(2, 6, 23, 0.42)),
          radial-gradient(circle at 50% 48%, rgba(2, 6, 23, 0.58) 0%, rgba(2, 6, 23, 0.24) 18%, rgba(2, 6, 23, 0.04) 44%, rgba(2, 6, 23, 0.62) 100%);
      }

      .raelyn-startup-canvas {
        display: block;
        z-index: 2;
        opacity: 0;
        transition: opacity 220ms ease;
      }

      .raelyn-startup-screen-starfield .raelyn-startup-canvas {
        opacity: 0.92;
      }

      @keyframes raelyn-startup-ambient {
        0% {
          transform: translate3d(-1.5%, -1%, 0) scale(1.02);
          opacity: 0.48;
        }
        100% {
          transform: translate3d(1.5%, 1%, 0) scale(1.06);
          opacity: 0.78;
        }
      }

      .raelyn-startup-stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-shadow:
          0 10px 28px rgba(2, 6, 23, 0.42),
          0 2px 8px rgba(2, 6, 23, 0.38);
      }

      .raelyn-startup-panel {
        width: 100%;
        padding: 1.25rem 0;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .raelyn-startup-singularity {
        position: relative;
        isolation: isolate;
        width: 8rem;
        height: 5rem;
        margin: 0 auto;
        filter: drop-shadow(0 16px 30px rgba(2, 6, 23, 0.72));
        animation: raelyn-startup-singularity 5.2s ease-in-out infinite;
      }

      .raelyn-startup-accretion,
      .raelyn-startup-front-arc,
      .raelyn-startup-horizon {
        position: absolute;
        left: 50%;
        top: 50%;
      }

      .raelyn-startup-accretion {
        z-index: 1;
        width: 7.5rem;
        height: 2.2rem;
        border-radius: 50%;
        transform: translate(-50%, -50%) rotate(-12deg);
        background:
          radial-gradient(
            ellipse at center,
            rgba(2, 6, 23, 0) 0%,
            rgba(2, 6, 23, 0.08) 21%,
            rgba(125, 211, 252, 0.86) 30%,
            rgba(45, 212, 191, 0.68) 39%,
            rgba(56, 189, 248, 0.36) 50%,
            rgba(167, 139, 250, 0.18) 60%,
            rgba(2, 6, 23, 0) 73%
          ),
          conic-gradient(
            from 238deg,
            rgba(125, 211, 252, 0.06),
            rgba(255, 255, 255, 0.72),
            rgba(45, 212, 191, 0.2),
            rgba(167, 139, 250, 0.48),
            rgba(125, 211, 252, 0.06)
          );
        box-shadow:
          0 0 18px rgba(56, 189, 248, 0.18),
          0 0 38px rgba(45, 212, 191, 0.1);
        filter: blur(0.35px);
        animation: raelyn-startup-accretion 6s ease-in-out infinite;
      }

      .raelyn-startup-horizon {
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 3.1rem;
        height: 3.1rem;
        border-radius: 9999px;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle at 42% 35%, rgba(15, 23, 42, 0.96), rgba(1, 3, 12, 1) 62%, rgba(0, 0, 0, 1) 100%);
        box-shadow:
          0 0 16px rgba(2, 6, 23, 0.96),
          0 0 26px rgba(56, 189, 248, 0.16),
          inset -0.32rem -0.38rem 0.8rem rgba(0, 0, 0, 0.86);
      }

      .raelyn-startup-front-arc {
        z-index: 3;
        width: 6.9rem;
        height: 2rem;
        border-bottom: 2px solid rgba(186, 230, 253, 0.78);
        border-radius: 50%;
        transform: translate(-50%, -50%) rotate(-12deg);
        clip-path: inset(50% 0 0 0);
        box-shadow: 0 8px 18px rgba(45, 212, 191, 0.12);
        opacity: 0.78;
        animation: raelyn-startup-front-arc 4.8s ease-in-out infinite;
      }

      .raelyn-startup-horizon-mark {
        width: 2.15rem;
        height: 2.15rem;
        object-fit: contain;
        opacity: 0.82;
        filter: drop-shadow(0 0 8px rgba(94, 234, 212, 0.3));
      }

      @keyframes raelyn-startup-singularity {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-0.12rem);
        }
      }

      @keyframes raelyn-startup-accretion {
        0%,
        100% {
          opacity: 0.78;
          filter: blur(0.35px) saturate(0.94);
        }
        50% {
          opacity: 1;
          filter: blur(0.18px) saturate(1.16);
        }
      }

      @keyframes raelyn-startup-front-arc {
        0%,
        100% {
          opacity: 0.62;
        }
        50% {
          opacity: 0.92;
        }
      }

      .raelyn-startup-dots {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.45rem;
      }

      .raelyn-startup-dots span {
        width: 0.42rem;
        height: 0.42rem;
        border-radius: 9999px;
        background: rgba(148, 163, 184, 0.72);
        box-shadow: 0 0 12px rgba(125, 211, 252, 0.12);
        animation: raelyn-startup-dot 1.4s ease-in-out infinite;
      }

      .raelyn-startup-dots span:nth-child(2) {
        animation-delay: -0.18s;
      }

      .raelyn-startup-dots span:nth-child(3) {
        animation-delay: -0.36s;
      }

      @keyframes raelyn-startup-dot {
        0%,
        100% {
          transform: translateY(0);
          opacity: 0.34;
        }
        50% {
          transform: translateY(-0.32rem);
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .video-card {
          transition: none;
        }
        .video-card:hover {
          transform: none;
        }
        .raelyn-startup-shell {
          transition: none;
        }
        .raelyn-startup-screen::after,
        .raelyn-startup-canvas,
        .raelyn-startup-singularity,
        .raelyn-startup-accretion,
        .raelyn-startup-front-arc,
        .raelyn-startup-dots span {
          animation: none !important;
          transition: none !important;
        }
      }

      .raelyn-brief h2 {
        display: inline-block;
        width: fit-content;
        max-width: 100%;
        padding: 0.1rem 0.5rem;
        border-radius: 0.2rem;
        background: rgba(148, 163, 184, 0.14);
        color: oklch(0.704 0.14 182.503);
      }
    </style>
    <script defer src="/static/app.js?v=__RAELYN_ASSET_VERSION__"></script>
    <script defer src="/static/vendor/alpine.min.js"></script>
  </head>
