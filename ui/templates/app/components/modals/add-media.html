      <!-- Add media modal -->
      <div x-show="modals.addMedia" class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4" x-transition>
        <div class="raelyn-modal-surface w-full max-w-lg rounded-xl border border-slate-800 p-4">
          <div class="text-sm font-semibold" x-text="activeView==='library' && libraryScope==='domain' ? '通过 URL 加入当前观测域' : '添加媒体'"></div>
          <div class="mt-3 space-y-3">
            <input
              class="w-full rounded-md border border-slate-700 bg-slate-950/30 px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500/30"
              placeholder="YouTube/B站 URL"
              x-model="addMediaUrl"
            />
            <div class="text-xs text-slate-400" x-show="!(activeView==='library' && libraryScope==='domain')">添加后默认不启用全局监控；如需自动同步，请在媒体列表中手动开启。</div>
            <div class="text-xs text-slate-400" x-show="activeView==='library' && libraryScope==='domain'">系统会先按平台身份查重；不存在时新建全局信源，并在同一事务内加入当前观测域。默认不启用全局监控。</div>
            <div class="text-xs text-rose-200" x-show="addMediaError" x-text="addMediaError"></div>
            <div class="flex items-center justify-end gap-2">
              <button
                class="px-3 py-1.5 rounded-md border border-slate-700 bg-slate-950/20 text-sm text-slate-200 hover:bg-slate-800/60"
                @click="modals.addMedia=false"
              >
                取消
              </button>
              <button
                class="px-3 py-1.5 rounded-md bg-emerald-500 text-sm font-medium text-slate-950 hover:bg-emerald-400"
                @click="submitAddMedia()"
                :disabled="addMediaSubmitting"
                :class="addMediaSubmitting ? 'opacity-70 cursor-not-allowed' : ''"
              >
                <span x-show="!addMediaSubmitting">确定</span>
                <span x-show="addMediaSubmitting">提交中…</span>
              </button>
            </div>
          </div>
        </div>
      </div>
