<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Raelyn V2 今日观察低保真线框</title>
  <desc id="desc">包含观测域切换、当前星图预览、变化摘要、最新简报、故事更新与数据质量的桌面端低保真布局。</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif; }
      .bg { fill: #020617; }
      .surface { fill: #0b1221; }
      .panel { fill: #0f172a; stroke: #334155; stroke-width: 1; }
      .panel-soft { fill: #0b1324; stroke: #1e293b; stroke-width: 1; }
      .divider { stroke: #1e293b; stroke-width: 1; }
      .grid { stroke: #1e293b; stroke-width: 1; fill: none; opacity: 0.7; }
      .title { fill: #f1f5f9; font-size: 18px; font-weight: 650; }
      .heading { fill: #e2e8f0; font-size: 14px; font-weight: 650; }
      .body { fill: #cbd5e1; font-size: 12px; }
      .small { fill: #94a3b8; font-size: 11px; }
      .tiny { fill: #64748b; font-size: 10px; }
      .mono { fill: #94a3b8; font-size: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .active { fill: #064e3b; stroke: #10b981; stroke-width: 1; }
      .active-text { fill: #a7f3d0; font-size: 12px; font-weight: 650; }
      .button { fill: #111c2f; stroke: #475569; stroke-width: 1; }
      .button-primary { fill: #10b981; stroke: #34d399; stroke-width: 1; }
      .button-primary-text { fill: #022c22; font-size: 11px; font-weight: 700; }
      .pill { fill: #0b1324; stroke: #334155; stroke-width: 1; }
      .pill-green { fill: #052e2b; stroke: #10b981; stroke-width: 1; }
      .callout { fill: #e2e8f0; stroke: #020617; stroke-width: 3; }
      .callout-text { fill: #0f172a; font-size: 11px; font-weight: 800; text-anchor: middle; dominant-baseline: central; }
    </style>
    <linearGradient id="mapSurface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#081426"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="mapGlow">
