services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: videosync
      POSTGRES_USER: videosync
      POSTGRES_PASSWORD: videosync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/video-sync || true &&
      exit 0
      "

  api:
    build: .
    environment:
      APP_ENV: dev
      BASE_URL: http://127.0.0.1:8000
      TIMEZONE: Asia/Shanghai
      DATABASE_URL: postgresql+psycopg://videosync:videosync@postgres:5432/videosync
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      S3_BUCKET: video-sync
      S3_USE_SSL: "false"
      AUTO_DOWNLOAD_NEW_VIDEOS: "true"
      SYNC_INTERVAL_MINUTES: "5"
      SYNC_BATCH_SIZE: "20"
      SYNC_MAX_ENTRIES: "50"
    volumes:
      - ./static:/app/static
      - ./tmp:/app/tmp
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - minio-init
    command: ["bash", "-lc", "python -m videosync.api_server"]

  worker-download:
    build: .
    environment:
      APP_ENV: dev
      TIMEZONE: Asia/Shanghai
      DATABASE_URL: postgresql+psycopg://videosync:videosync@postgres:5432/videosync
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      S3_BUCKET: video-sync
      S3_USE_SSL: "false"
      WORKER_ROLE: download
    volumes:
      - ./tmp:/app/tmp
    depends_on:
      - postgres
      - minio-init
    command: ["bash", "-lc", "python -m videosync.worker"]

  worker-process:
    build: .
    environment:
      APP_ENV: dev
      TIMEZONE: Asia/Shanghai
      DATABASE_URL: postgresql+psycopg://videosync:videosync@postgres:5432/videosync
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      S3_BUCKET: video-sync
      S3_USE_SSL: "false"
      WORKER_ROLE: process
    volumes:
      - ./tmp:/app/tmp
    depends_on:
      - postgres
      - minio-init
    command: ["bash", "-lc", "python -m videosync.worker"]

  worker-sync:
    build: .
    environment:
      APP_ENV: dev
      TIMEZONE: Asia/Shanghai
      DATABASE_URL: postgresql+psycopg://videosync:videosync@postgres:5432/videosync
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      S3_BUCKET: video-sync
      S3_USE_SSL: "false"
      WORKER_ROLE: sync
    volumes:
      - ./tmp:/app/tmp
    depends_on:
      - postgres
      - minio-init
    command: ["bash", "-lc", "python -m videosync.worker"]

  worker-ai:
    build: .
    environment:
      APP_ENV: dev
      TIMEZONE: Asia/Shanghai
      DATABASE_URL: postgresql+psycopg://videosync:videosync@postgres:5432/videosync
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      S3_BUCKET: video-sync
      S3_USE_SSL: "false"
      WORKER_ROLE: ai
    volumes:
      - ./tmp:/app/tmp
    depends_on:
      - postgres
      - minio-init
    command: ["bash", "-lc", "python -m videosync.worker"]

  scheduler:
    build: .
    environment:
      APP_ENV: dev
      TIMEZONE: Asia/Shanghai
      DATABASE_URL: postgresql+psycopg://videosync:videosync@postgres:5432/videosync
      SYNC_INTERVAL_MINUTES: "5"
      SYNC_BATCH_SIZE: "20"
    depends_on:
      - postgres
    command: ["bash", "-lc", "python -m videosync.scheduler"]

volumes:
  postgres_data:
  minio_data:
