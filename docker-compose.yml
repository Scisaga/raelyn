services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: raelyn
      POSTGRES_USER: raelyn
      POSTGRES_PASSWORD: raelyn
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/raelyn || true &&
      exit 0
      "

  bgutil-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1-node
    init: true
    network_mode: host

  app:
    build: .
    environment:
      APP_ENV: dev
      BASE_URL: http://127.0.0.1:8000
      TIMEZONE: Asia/Shanghai
      DATABASE_URL: postgresql+psycopg://raelyn:raelyn@postgres:5432/raelyn
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      S3_BUCKET: raelyn
      S3_USE_SSL: "false"
      AUTO_DOWNLOAD_NEW_VIDEOS: "true"
      SYNC_INTERVAL_MINUTES: "5"
      SYNC_BATCH_SIZE: "20"
      SYNC_MAX_ENTRIES: "10"
      YTDLP_POT_BGUTIL_BASE_URL: http://host.docker.internal:4416
      YTDLP_YOUTUBE_IMPERSONATE: chrome
      NO_PROXY: 127.0.0.1,localhost,::1,host.docker.internal
      no_proxy: 127.0.0.1,localhost,::1,host.docker.internal
    volumes:
      - ./static:/app/static
      - ./tmp:/app/tmp
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - minio-init
      - bgutil-pot
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["bash", "-lc", "bash /app/scripts/docker/entrypoint.sh"]

volumes:
  postgres_data:
  minio_data:
