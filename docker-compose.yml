services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-raelyn}"
      POSTGRES_USER: "${POSTGRES_USER:-raelyn}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${S3_ACCESS_KEY:?请在 .env 中设置 S3_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY:?请在 .env 中设置 S3_SECRET_KEY}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: "${S3_ACCESS_KEY:?请在 .env 中设置 S3_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY:?请在 .env 中设置 S3_SECRET_KEY}"
      S3_BUCKET: "${S3_BUCKET:-raelyn}"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" &&
      mc mb -p \"local/$${S3_BUCKET}\" || true &&
      exit 0
      "

  bgutil-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1-node
    init: true
    restart: unless-stopped
    network_mode: host

  app:
    build: .
    environment:
      APP_ENV: "${APP_ENV:-dev}"
      BASE_URL: "${BASE_URL:-http://127.0.0.1:8000}"
      TIMEZONE: "${TIMEZONE:-Asia/Shanghai}"
      API_BEARER_TOKEN: "${API_BEARER_TOKEN:?请在 .env 中设置 API_BEARER_TOKEN}"
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-raelyn}:${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-raelyn}"
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:?请在 .env 中设置 S3_ACCESS_KEY}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:?请在 .env 中设置 S3_SECRET_KEY}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_BUCKET: "${S3_BUCKET:-raelyn}"
      S3_USE_SSL: "false"
      S3_TRANSFER_MAX_CONCURRENCY: "${S3_TRANSFER_MAX_CONCURRENCY:-2}"
      S3_TRANSFER_MULTIPART_THRESHOLD_BYTES: "${S3_TRANSFER_MULTIPART_THRESHOLD_BYTES:-67108864}"
      S3_TRANSFER_MULTIPART_CHUNKSIZE_BYTES: "${S3_TRANSFER_MULTIPART_CHUNKSIZE_BYTES:-67108864}"
      AUTO_DOWNLOAD_NEW_VIDEOS: "${AUTO_DOWNLOAD_NEW_VIDEOS:-true}"
      AUTO_GENERATE_BRIEFS: "${AUTO_GENERATE_BRIEFS:-false}"
      SYNC_INTERVAL_MINUTES: "${SYNC_INTERVAL_MINUTES:-60}"
      SYNC_BATCH_SIZE: "${SYNC_BATCH_SIZE:-2}"
      SYNC_MAX_ENTRIES: "${SYNC_MAX_ENTRIES:-10}"
      ANALYSIS_CPU_THREADS: "${ANALYSIS_CPU_THREADS:-2}"
      YTDLP_POT_BGUTIL_BASE_URL: http://host.docker.internal:4416
      YTDLP_YOUTUBE_IMPERSONATE: "${YTDLP_YOUTUBE_IMPERSONATE:-chrome}"
      NO_PROXY: 127.0.0.1,localhost,::1,host.docker.internal
      no_proxy: 127.0.0.1,localhost,::1,host.docker.internal
    volumes:
      - ./static:/app/static
      - ./tmp:/app/tmp
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - minio-init
      - bgutil-pot
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["bash", "-lc", "bash /app/scripts/docker/entrypoint.sh"]

volumes:
  postgres_data:
  minio_data:
